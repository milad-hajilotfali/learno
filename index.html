/* ── AUDIO ── */
let _v=[];
const lv=()=>{try{_v=window.speechSynthesis.getVoices()||[];}catch(_){}};
if(typeof window!=="undefined"&&"speechSynthesis" in window){lv();try{window.speechSynthesis.onvoiceschanged=lv;}catch(_){}}
const pv=p=>{if(!_v.length)lv();return _v.find(v=>v.lang&&v.lang.toLowerCase().replace("_","-").startsWith(p))||null;};
let _pr=false;
function prTTS(){try{if(_pr||!("speechSynthesis" in window))return;_pr=true;const u=new SpeechSynthesisUtterance(" ");u.volume=0;window.speechSynthesis.speak(u);}catch(_){}}
if(typeof window!=="undefined")window.addEventListener("pointerdown",prTTS,{once:true});
function spSynth(t,lc){try{if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lc;const v=pv(lc.slice(0,2).toLowerCase());if(v)u.voice=v;u.rate=0.85;window.speechSynthesis.speak(u);}catch(_){}}
let _au=null;
function spNet(t,tl){return new Promise((res,rej)=>{try{if(_au)try{_au.pause();}catch(_){}const url="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+tl+"&q="+encodeURIComponent(t);_au=new Audio(url);_au.onerror=()=>rej();const p=_au.play();if(p&&p.then)p.then(res).catch(rej);else res();}catch(_){rej();}});}
function speak(text,lc){prTTS();const p=(lc||"").slice(0,2).toLowerCase();const tl=p==="fa"?"fa":"de";const go=()=>{const v=pv(p);if(v)spSynth(text,lc);else spNet(text,tl).catch(()=>spSynth(text,lc));};go();}

async function shareImage(node,text,filename,bg){
  if(!node||!window.html2canvas)return"nolib";
  try{const canvas=await window.html2canvas(node,{backgroundColor:bg||"#FFF",scale:3,useCORS:true,logging:false,allowTaint:true,imageTimeout:8000});const blob=await new Promise(r=>canvas.toBlob(r,"image/png",1.0));if(!blob)return"error";const file=new File([blob],filename,{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return"shared";}const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);return"downloaded";}catch(e){return"error";}
}

function buildHistory(){
  const TOTAL=84;const now=new Date();const out=[];
  for(let i=TOTAL-1;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);const seed=d.getFullYear()*372+(d.getMonth()+1)*31+d.getDate();const r=Math.abs(Math.sin(seed));let pts;if(i===0)pts=0;else if(i<=10)pts=Math.round(8+r*14);else pts=r>0.32?Math.round(5+r*16):0;out.push({date:d.toISOString().slice(0,10),label:DAY_NAMES[d.getDay()],dm:MONTHS[d.getMonth()]+" "+d.getDate(),points:pts});}
  return out;
}
function calcStreak(h){let i=h.length-1;if(h[i].points===0)i--;let s=0;for(;i>=0;i--){if(h[i].points>0)s++;else break;}return s;}

function Icon({name,size=18,color,style}){return <i className={"fa-solid fa-"+name} style={{fontSize:size,color,lineHeight:1,...style}} aria-hidden="true"></i>;}
function useCountUp(target,dur=700){const[val,setVal]=useState(0);useEffect(()=>{let raf;const start=performance.now();const tick=now=>{const p=Math.min(1,(now-start)/dur);setVal(Math.round(target*easeOut(p)));if(p<1)raf=requestAnimationFrame(tick);};raf=requestAnimationFrame(tick);return()=>cancelAnimationFrame(raf);},[target,dur]);return val;}
function Avatar({seed,size=44,ring}){const[err,setErr]=useState(false);return(<div style={{width:size,height:size,borderRadius:"50%",overflow:"hidden",background:C.primarySoft,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:ring?("0 0 0 3px "+ring):"none"}}>{!err?<img src={avatarURL(seed)} crossOrigin="anonymous" onError={()=>setErr(true)} alt="" style={{width:"100%",height:"100%"}}/>:<Icon name="user" size={size*0.5} color={C.primary}/>}</div>);}
function SpeakBtn({text,lang,color,size=38}){const s=e=>e.stopPropagation();return(<button onPointerDown={s} onClick={e=>{s(e);speak(text,lang);}} className="press" style={{width:size,height:size,borderRadius:"50%",border:"none",cursor:"pointer",background:color+"1A",display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="volume-high" size={size*0.42} color={color}/></button>);}
function PrimaryButton({children,onClick,disabled}){return(<button onClick={onClick} disabled={disabled} className="press" style={{width:"100%",padding:16,borderRadius:18,border:"none",cursor:disabled?"not-allowed":"pointer",background:disabled?C.line:C.primary,color:disabled?C.sub:"#fff",fontSize:16.5,fontWeight:800,fontFamily:FONT,boxShadow:disabled?"none":"0 8px 22px "+C.primary+"44"}}>{children}</button>);}
function Shell({children}){return(<div style={{height:"100vh",height:"100dvh",width:"100%",display:"flex",justifyContent:"center",background:C.bg,fontFamily:FONT,overflow:"hidden"}}><div style={{width:"100%",maxWidth:440,height:"100%",position:"relative",display:"flex",flexDirection:"column",overflow:"hidden"}}>{children}</div></div>);}

function AppSelect({value,onChange,options,placeholder}){
  const[open,setOpen]=useState(false);
  const ref=useRef(null);
  const selected=options.find(o=>o.value===value);
  useEffect(()=>{
    const handler=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("pointerdown",handler);
    return()=>document.removeEventListener("pointerdown",handler);
  },[]);
  return(
    <div ref={ref} style={{position:"relative"}}>
      <button onClick={()=>setOpen(o=>!o)} className="press" style={{width:"100%",padding:"12px 14px",borderRadius:14,border:"1.5px solid "+(open?C.primary:C.line),background:C.surface,display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",fontFamily:FONT,textAlign:"left"}}>
        <span style={{fontSize:15,color:selected?C.ink:C.sub,fontWeight:selected?600:400}}>{selected?selected.label:(placeholder||"Select…")}</span>
        <Icon name={open?"chevron-up":"chevron-down"} size={14} color={C.sub}/>
      </button>
      {open&&(
        <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,right:0,background:C.surface,borderRadius:16,border:"1.5px solid "+C.line,boxShadow:"0 12px 32px rgba(28,26,46,0.12)",zIndex:200,overflow:"hidden",maxHeight:240,overflowY:"auto"}}>
          {options.map((o,i)=>(
            <button key={o.value} onClick={()=>{onChange(o.value);setOpen(false);}} className="press" style={{width:"100%",padding:"12px 16px",border:"none",borderBottom:i<options.length-1?"1px solid "+C.line:"none",background:value===o.value?C.primarySoft:C.surface,display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",fontFamily:FONT,textAlign:"left"}}>
              <span style={{fontSize:14.5,color:value===o.value?C.primary:C.ink,fontWeight:value===o.value?700:400}}>{o.label}</span>
              {value===o.value&&<Icon name="check" size={14} color={C.primary}/>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── STEP DOTS — fixed at bottom of screen ── */
function StepDots({current}){
  return(
    <div style={{display:"flex",gap:7,justifyContent:"center",padding:"16px 0 0"}}>
      {[0,1,2].map(i=>(<div key={i} style={{width:i===current?22:8,height:8,borderRadius:4,background:i===current?C.primary:C.line,transition:"all .3s cubic-bezier(.2,.8,.2,1)"}}/>))}
    </div>
  );
}

/* ── SHEET ── */
function Sheet({children,onClose,title}){
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(20,18,40,0.45)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:100}}>
      <div onClick={e=>e.stopPropagation()} className="sheet-in" style={{width:"100%",maxWidth:440,background:C.surface,borderRadius:"26px 26px 0 0",maxHeight:"88vh",display:"flex",flexDirection:"column",fontFamily:FONT}}>
        <div style={{flexShrink:0,padding:"14px 22px 12px",background:C.surface,borderRadius:"26px 26px 0 0",borderBottom:"1px solid "+C.line,display:"flex",alignItems:"center",justifyContent:"space-between",position:"relative"}}>
          <div style={{width:40,height:5,background:C.line,borderRadius:4,position:"absolute",top:10,left:"50%",transform:"translateX(-50%)"}}/>
          {title?<h2 style={{fontSize:18,fontWeight:800,color:C.ink,margin:"6px 0 0",flex:1}}>{title}</h2>:<div style={{height:16}}/>}
          <button onClick={onClose} className="press" style={{width:32,height:32,borderRadius:"50%",border:"none",background:C.bg,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",marginTop:4,flexShrink:0}}><Icon name="xmark" size={14} color={C.sub}/></button>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"16px 22px",paddingBottom:"calc(24px + env(safe-area-inset-bottom))"}}>{children}</div>
      </div>
    </div>
  );
}

function Toggle({on,onChange,label,sub}){return(<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 0",borderBottom:"1px solid "+C.line}}><div><div style={{fontSize:15,fontWeight:700,color:C.ink}}>{label}</div>{sub&&<div style={{fontSize:12.5,color:C.sub,marginTop:2}}>{sub}</div>}</div><button onClick={()=>onChange(!on)} className="press" style={{width:50,height:28,borderRadius:14,border:"none",cursor:"pointer",background:on?C.primary:C.line,position:"relative",flexShrink:0,transition:"background .2s"}}><div style={{width:22,height:22,borderRadius:11,background:"#fff",position:"absolute",top:3,left:on?25:3,transition:"left .2s",boxShadow:"0 1px 4px rgba(0,0,0,0.2)"}}/></button></div>);}

function Confetti(){const pieces=useMemo(()=>{const cols=[C.primary,C.green,C.fa,C.de,C.amber,"#A06BFF"];return Array.from({length:90},(_,i)=>({id:i,left:Math.random()*100,delay:Math.random()*0.6,dur:2.2+Math.random()*1.6,size:6+Math.random()*10,color:cols[i%cols.length],rot:Math.random()*360,round:Math.random()>0.5}));},[]);return(<div style={{position:"absolute",inset:0,overflow:"hidden",pointerEvents:"none",zIndex:50}}>{pieces.map(p=>(<div key={p.id} style={{position:"absolute",top:"-20px",left:p.left+"%",width:p.size,height:p.size,background:p.color,borderRadius:p.round?"50%":"2px",transform:"rotate("+p.rot+"deg)",animation:"confetti "+p.dur+"s "+p.delay+"s linear forwards"}}/>))}</div>);}

/* ══════════ APP ══════════ */
function App(){
  const[screen,setScreen]=useState("welcome");
  const[tab,setTab]=useState("dashboard");
  const[selectedLangs,setSelectedLangs]=useState([]);
  const[user,setUser]=useState(null);
  const[allCards,setAllCards]=useState([]);
  const[learnedIds,setLearnedIds]=useState([]);
  const[markedIds,setMarkedIds]=useState([]);
  const[reviewIds,setReviewIds]=useState([]);
  const[queue,setQueue]=useState([]);
  const[history,setHistory]=useState(()=>buildHistory());
  const[deckSettings,setDeckSettings]=useState({autoSpeak:false,onlyUnknown:false});
  const[curLevel,setCurLevel]=useState("A1");
  const[curChapter,setCurChapter]=useState("A1-1");
  const[friends,setFriends]=useState([]);
  const[allUsers]=useState(BASE_USERS);
  const[receivedHearts,setReceivedHearts]=useState([]);
  const[cardsSubScreen,setCardsSubScreen]=useState(null);
  const dayStreak=useMemo(()=>calcStreak(history),[history]);
  const totalPoints=useMemo(()=>history.reduce((a,d)=>a+d.points,0),[history]);
  const committed=useRef(false);const roundPointsRef=useRef(0);

  const initData=async langs=>{await delay(100);setAllCards(WORDS.filter(w=>langs.includes(w.language)));setLearnedIds([]);setMarkedIds([]);setReviewIds([]);setQueue([]);};
  const chapterCards=useMemo(()=>allCards.filter(c=>c.chapter===curChapter),[allCards,curChapter]);
  const chapterRemaining=useMemo(()=>chapterCards.filter(c=>!learnedIds.includes(c.id)),[chapterCards,learnedIds]);

  useEffect(()=>{
    if(chapterCards.length>0&&chapterRemaining.length===0){const lvC=CHAPTERS[curLevel];const idx=lvC.findIndex(c=>c.id===curChapter);if(idx>=0&&idx<lvC.length-1)setTimeout(()=>setCurChapter(lvC[idx+1].id),800);}
  },[chapterCards.length,chapterRemaining.length,curChapter,curLevel]);

  const[flipped,setFlipped]=useState(false);
  const[dragX,setDragX]=useState(0);
  const[dragging,setDragging]=useState(false);
  const[exitDir,setExitDir]=useState(null);
  const[historyStack,setHistoryStack]=useState([]);
  const[showDeckSettings,setShowDeckSettings]=useState(false);
  const sX=useRef(0);const mv=useRef(false);const act=useRef(false);const locked=useRef(false);

  const startSession=pool=>{if(!pool||!pool.length)return;setQueue(shuffle([...pool]));roundPointsRef.current=0;committed.current=false;setFlipped(false);setDragX(0);setExitDir(null);setHistoryStack([]);setScreen("deck");};
  const startChapterSession=()=>{const pool=deckSettings.onlyUnknown?chapterCards.filter(c=>reviewIds.includes(c.id)):chapterRemaining.length>0?chapterRemaining:chapterCards;startSession(pool);};
  const startReviewSession=()=>startSession(allCards.filter(c=>reviewIds.includes(c.id)));
  const startMarkedSession=()=>startSession(allCards.filter(c=>markedIds.includes(c.id)));
  const commitRound=pts=>{if(pts<=0)return;setHistory(h=>{const c=[...h];c[c.length-1]={...c[c.length-1],points:c[c.length-1].points+pts};return c;});};
  const exitToApp=()=>{if(!committed.current&&roundPointsRef.current>0){committed.current=true;commitRound(roundPointsRef.current);}setTab("dashboard");setScreen("app");};
  useEffect(()=>{if(screen==="deck"&&queue.length===0&&!committed.current&&allCards.length){committed.current=true;commitRound(roundPointsRef.current);};},[screen,queue.length,allCards.length]);
  useEffect(()=>{if(screen==="deck"&&queue.length>0&&deckSettings.autoSpeak&&!flipped){const card=queue[0];speak(sayWordOf(card),langMeta[card.language].ttsLang);}},[screen,queue[0]?.id,deckSettings.autoSpeak,flipped]);

  const commitSwipe=dir=>{
    setQueue(q=>{if(!q.length)return q;const top=q[0],rest=q.slice(1);
      if(dir==="right"){setLearnedIds(ids=>ids.includes(top.id)?ids:[...ids,top.id]);setReviewIds(ids=>ids.filter(x=>x!==top.id));roundPointsRef.current+=1;setHistoryStack(h=>[top,...h]);return rest;}
      setReviewIds(ids=>ids.includes(top.id)?ids:[...ids,top.id]);setHistoryStack(h=>[top,...h]);return rest;
    });setFlipped(false);setDragX(0);setExitDir(null);locked.current=false;
  };
  const goBack=()=>{if(historyStack.length===0||locked.current)return;const[prev,...rest]=historyStack;setHistoryStack(rest);setQueue(q=>[prev,...q]);setFlipped(false);setDragX(0);};
  const triggerSwipe=dir=>{if(locked.current||queue.length===0)return;locked.current=true;setExitDir(dir);setDragging(false);setTimeout(()=>commitSwipe(dir),320);};
  const onPD=e=>{if(exitDir)return;act.current=true;mv.current=false;sX.current=e.clientX;setDragging(true);try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}};
  const onPM=e=>{if(!act.current||exitDir)return;const dx=e.clientX-sX.current;if(Math.abs(dx)>8)mv.current=true;setDragX(dx);};
  const onPU=()=>{if(!act.current)return;act.current=false;setDragging(false);if(!mv.current){setFlipped(f=>!f);setDragX(0);return;}if(dragX>110)triggerSwipe("right");else if(dragX<-110)triggerSwipe("left");else setDragX(0);};

  const toggleMark=id=>setMarkedIds(ids=>ids.includes(id)?ids.filter(x=>x!==id):[...ids,id]);
  const addCard=card=>setAllCards(prev=>[...prev,card]);
  const deleteCard=id=>{setAllCards(p=>p.filter(c=>c.id!==id));setQueue(q=>q.filter(c=>c.id!==id));setLearnedIds(ids=>ids.filter(x=>x!==id));};
  const signOut=()=>{setUser(null);setSelectedLangs([]);setAllCards([]);setLearnedIds([]);setMarkedIds([]);setReviewIds([]);setQueue([]);setHistory(buildHistory());setFriends([]);setTab("dashboard");setScreen("welcome");};
  const addFriend=id=>setFriends(f=>f.includes(id)?f:[...f,id]);
  const removeFriend=id=>setFriends(f=>f.filter(x=>x!==id));
  const sendHeart=toId=>{const from=cap(user?.name||"You");setReceivedHearts(h=>[{from,toId,time:new Date().toLocaleTimeString()},...h.slice(0,19)]);};

  /* ONBOARDING */
  if(screen==="welcome")return <Welcome onStart={()=>setScreen("register")} onSignIn={()=>setScreen("signin")}/>;
  if(screen==="register"||screen==="signin")return <AuthScreen mode={screen} onSwitch={setScreen} onDone={u=>{setUser(u);setScreen("language");}}/>;
  if(screen==="language"){
    const choose=l=>{setSelectedLangs([l]);setScreen("level");};
    return(<Shell><StyleTag/>
      <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>
        <div style={{flex:1,overflowY:"auto",padding:"52px 24px 0"}}>
          <div style={{fontSize:38,marginBottom:12}}>🌍</div>
          <h1 style={{fontSize:30,fontWeight:800,color:C.ink,margin:"0 0 6px",letterSpacing:-0.8,lineHeight:1.15}}>What do you<br/>want to learn?</h1>
          <p style={{color:C.sub,margin:"0 0 28px",fontSize:15.5}}>Tap a language to continue.</p>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {["fa","de"].map(l=>{const m=langMeta[l];return(<button key={l} onClick={()=>choose(l)} className="press" style={{display:"flex",alignItems:"center",gap:16,padding:18,borderRadius:20,cursor:"pointer",textAlign:"left",background:C.surface,border:"2px solid "+C.line,fontFamily:FONT}}><div style={{width:52,height:52,borderRadius:16,background:m.soft,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,flexShrink:0}}>{m.flag}</div><div style={{flex:1}}><div style={{fontSize:18,fontWeight:800,color:C.ink}}>{m.label}</div><div style={{fontSize:13.5,color:C.sub,fontWeight:500}}>{m.sub} · 5 levels</div></div><Icon name="chevron-right" size={16} color={C.sub}/></button>);})}
          </div>
        </div>
        <StepDots current={1}/>
        <div style={{height:"calc(16px + env(safe-area-inset-bottom))"}}/>
      </div>
    </Shell>);
  }
  if(screen==="level"){
    const LEVELS=[{id:"A1",title:"Beginner",desc:"I'm just starting."},{id:"A2",title:"Elementary",desc:"I know some everyday phrases."},{id:"B1",title:"Intermediate",desc:"I handle everyday conversations."},{id:"B2",title:"Upper-Intermediate",desc:"I talk comfortably about most topics."},{id:"C1",title:"Advanced",desc:"I'm nearly fluent."}];
    const choose=async lv=>{setCurLevel(lv);setCurChapter(CHAPTERS[lv][0].id);await initData(selectedLangs);setTab("dashboard");setScreen("app");};
    return(<Shell><StyleTag/>
      <div style={{padding:"20px 24px 0",paddingBottom:"calc(24px + env(safe-area-inset-bottom))",display:"flex",flexDirection:"column",flex:1,overflowY:"auto",minHeight:0}}>
        <button onClick={()=>setScreen("language")} className="press" style={{alignSelf:"flex-start",width:42,height:42,borderRadius:13,border:"1.5px solid "+C.line,background:C.surface,cursor:"pointer",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="arrow-left" size={16} color={C.ink}/></button>
        <StepDots current={2}/>
        <h1 style={{fontSize:28,fontWeight:800,color:C.ink,margin:"0 0 6px",letterSpacing:-0.7,lineHeight:1.15}}>Where are you<br/>starting from?</h1>
        <p style={{color:C.sub,margin:"0 0 20px",fontSize:15}}>Tap the level that sounds most like you.</p>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {LEVELS.map(lv=>{const lc=LEVEL_COLOR[lv.id];return(<button key={lv.id} onClick={()=>choose(lv.id)} className="press" style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderRadius:18,cursor:"pointer",textAlign:"left",background:C.surface,border:"2px solid "+C.line,fontFamily:FONT}}><div style={{width:46,height:46,borderRadius:13,background:lc.bg,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:15,color:lc.text,flexShrink:0}}>{lv.id}</div><div style={{flex:1,minWidth:0}}><div style={{fontSize:15,fontWeight:800,color:C.ink}}>{lv.title}</div><div style={{fontSize:12.5,color:C.sub,fontWeight:500}}>{lv.desc}</div></div><Icon name="chevron-right" size={15} color={C.sub}/></button>);})}
        </div>
      </div>
    </Shell>);
  }

  /* DECK */
  if(screen==="deck"){
    const current=queue[0];const sessionDone=queue.length===0;
    const chDone=chapterCards.filter(c=>learnedIds.includes(c.id)).length;
    const kh=Math.max(0,Math.min(1,dragX/110));const rh=Math.max(0,Math.min(1,-dragX/110));
    const topTf=exitDir?("translateX("+(exitDir==="right"?640:-640)+"px) rotate("+(exitDir==="right"?26:-26)+"deg)"):("translateX("+dragX+"px) rotate("+(dragX/22)+"deg)");
    const topTr=dragging?"none":"transform .34s cubic-bezier(.2,.8,.2,1)";
    const tint=exitDir==="right"?{c:C.green,o:0.92,t:"KNOW"}:exitDir==="left"?{c:C.red,o:0.92,t:"REVIEW"}:dragX>0?{c:C.green,o:kh*0.85,t:"KNOW"}:dragX<0?{c:C.red,o:rh*0.85,t:"REVIEW"}:{c:C.green,o:0,t:""};
    const chap=CHAPTERS[curLevel]?.find(c=>c.id===curChapter);
    const cBase={width:"100%",height:"100%",borderRadius:28,background:C.surface,boxShadow:"0 16px 40px rgba(28,26,46,0.14)",position:"absolute",inset:0,backfaceVisibility:"hidden",WebkitBackfaceVisibility:"hidden",overflow:"hidden"};
    return(<Shell><StyleTag/>
      {!sessionDone&&(
        <div style={{padding:"18px 18px 4px",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
          <button onClick={exitToApp} className="press" style={{background:C.surface,border:"1.5px solid "+C.line,borderRadius:14,width:44,height:44,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="xmark" size={18} color={C.ink}/></button>
          <div style={{flex:1,minWidth:0}}>
            <div style={{height:10,background:C.line,borderRadius:8,overflow:"hidden"}}><div style={{width:(chapterCards.length?(chDone/chapterCards.length)*100:0)+"%",height:"100%",background:C.primary,borderRadius:8,transition:"width .4s"}}/></div>
            <div style={{fontSize:11,fontWeight:600,color:C.sub,marginTop:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{LEVEL_LABEL[curLevel]} · {chap?.title} · {queue.length} left</div>
          </div>
          <button onClick={()=>setShowDeckSettings(true)} className="press" style={{background:C.surface,border:"1.5px solid "+C.line,borderRadius:14,width:44,height:44,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="gear" size={18} color={C.ink}/></button>
        </div>
      )}
      <div style={{flex:1,position:"relative",display:"flex",alignItems:"center",justifyContent:"center",padding:sessionDone?"0":"8px 20px 0",minHeight:0}}>
        {sessionDone?(<SessionComplete points={roundPointsRef.current} dayStreak={dayStreak} name={user&&user.name} level={curLevel} chapterTitle={chap?.title} onContinue={exitToApp}/>):(
          <div style={{position:"relative",width:"100%",maxWidth:360,height:470,margin:"0 auto"}}>
            {queue.slice(1,3).map((card,i)=>{const d=i+1;return(<div key={card.id} style={{position:"absolute",inset:0,transform:"translateY("+(d*13)+"px) scale("+(1-d*0.045)+")",zIndex:1}}><div style={{...cBase,border:"1px solid "+C.line}}/></div>);})}
            {current&&(
              <div key={current.id} onPointerDown={onPD} onPointerMove={onPM} onPointerUp={onPU} onPointerCancel={onPU} style={{position:"absolute",inset:0,zIndex:5,transform:topTf,transition:topTr,touchAction:"none",cursor:"grab"}}>
                <div style={{position:"relative",width:"100%",height:"100%"}}>
                  <div style={{position:"absolute",inset:0,perspective:1300}}>
                    <div style={{position:"relative",width:"100%",height:"100%",transformStyle:"preserve-3d",transform:"rotateY("+(flipped?180:0)+"deg)",transition:"transform .55s cubic-bezier(.4,.15,.2,1)"}}>
                      <CardFront card={current} marked={markedIds.includes(current.id)} onMark={()=>toggleMark(current.id)} cardBase={cBase}/>
                      <CardBack  card={current} marked={markedIds.includes(current.id)} onMark={()=>toggleMark(current.id)} cardBase={cBase}/>
                    </div>
                  </div>
                  <div style={{position:"absolute",inset:0,borderRadius:28,background:tint.c,opacity:tint.o,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none",transition:dragging?"none":"opacity .22s ease",zIndex:6}}>{tint.t&&<span style={{color:"#fff",fontWeight:900,fontSize:38,letterSpacing:3,textShadow:"0 2px 8px rgba(0,0,0,0.15)"}}>{tint.t}</span>}</div>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
      {!sessionDone&&(
        <div style={{padding:"10px 24px",paddingBottom:"calc(20px + env(safe-area-inset-bottom))",display:"flex",alignItems:"center",justifyContent:"center",gap:24,flexShrink:0}}>
          <button onClick={goBack} disabled={historyStack.length===0} className="press" style={{background:"transparent",border:"none",cursor:historyStack.length===0?"default":"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,opacity:historyStack.length===0?0.3:1}}>
            <Icon name="arrow-left" size={16} color={C.sub}/><span style={{fontSize:10.5,fontWeight:700,color:C.sub,letterSpacing:0.5}}>BACK</span>
          </button>
          <button onClick={()=>triggerSwipe("left")} className="press" style={actionBtn(C.red,60)}><Icon name="xmark" size={26} color="#fff"/></button>
          <button onClick={()=>setFlipped(f=>!f)} className="press" style={{background:"transparent",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <Icon name="arrows-rotate" size={16} color={C.sub}/><span style={{fontSize:10.5,fontWeight:700,color:C.sub,letterSpacing:0.5}}>FLIP</span>
          </button>
          <button onClick={()=>triggerSwipe("right")} className="press" style={actionBtn(C.green,60)}><Icon name="check" size={26} color="#fff"/></button>
          <div style={{width:32}}/>
        </div>
      )}
      {showDeckSettings&&(
        <Sheet onClose={()=>setShowDeckSettings(false)} title="Session settings">
          <Toggle on={deckSettings.autoSpeak} onChange={v=>setDeckSettings(s=>({...s,autoSpeak:v}))} label="Auto-speak card" sub="Read each card aloud automatically"/>
          <Toggle on={deckSettings.onlyUnknown} onChange={v=>setDeckSettings(s=>({...s,onlyUnknown:v}))} label="Only unknown cards" sub="Show only cards you've swiped left"/>
        </Sheet>
      )}
    </Shell>);
  }

  /* MAIN APP */
  if(screen==="app"&&tab==="mywords"&&cardsSubScreen){
    return(<Shell><StyleTag/>
      <ChapterDetailScreen chapter={cardsSubScreen} allCards={allCards} learnedIds={learnedIds} markedIds={markedIds} onMark={toggleMark} onResult={(id,known)=>setLearnedIds(ids=>known?(ids.includes(id)?ids:[...ids,id]):ids.filter(x=>x!==id))} onBack={()=>setCardsSubScreen(null)} onDelete={deleteCard}/>
      <TabBar tab={tab} setTab={t=>{setTab(t);setCardsSubScreen(null);}}/>
    </Shell>);
  }

  return(<Shell><StyleTag/>
    <div style={{flex:1,overflowY:tab==="profile"?"hidden":"auto",WebkitOverflowScrolling:"touch",minHeight:0}}>
      {tab==="dashboard"&&<Dashboard user={user} allCards={allCards} learnedIds={learnedIds} markedIds={markedIds} reviewIds={reviewIds} dayStreak={dayStreak} history={history} totalPoints={totalPoints} curLevel={curLevel} curChapter={curChapter} onLevelChapterSelect={(lv,ch)=>{setCurLevel(lv);setCurChapter(ch);}} onStart={startChapterSession} onStartReview={startReviewSession} onStartMarked={startMarkedSession} onOpenProfile={()=>setTab("profile")}/>}
      {tab==="stats"&&<StatsPage history={history} totalPoints={totalPoints} dayStreak={dayStreak} allCards={allCards} learnedIds={learnedIds}/>}
      {tab==="mywords"&&<MyFlashcardsPage allCards={allCards} learnedIds={learnedIds} markedIds={markedIds} reviewIds={reviewIds} curLevel={curLevel} curChapter={curChapter} onResult={(id,known)=>setLearnedIds(ids=>known?(ids.includes(id)?ids:[...ids,id]):ids.filter(x=>x!==id))} onMark={toggleMark} onAdd={addCard} onDelete={deleteCard} selectedLangs={selectedLangs} onOpenChapter={ch=>setCardsSubScreen(ch)}/>}
      {tab==="friends"&&<FriendsPage currentUser={user} allUsers={allUsers} friends={friends} onAdd={addFriend} onRemove={removeFriend} onSendHeart={sendHeart} receivedHearts={receivedHearts}/>}

  const sx=useRef(0);const mv=useRef(false);const act=useRef(false);const lk=useRef(false);
  const cBase={width:"100%",height:"100%",borderRadius:28,background:C.surface,boxShadow:"0 16px 40px rgba(28,26,46,0.14)",position:"absolute",inset:0,backfaceVisibility:"hidden",WebkitBackfaceVisibility:"hidden",overflow:"hidden"};
  const fin=dir=>{if(lk.current)return;lk.current=true;setExitDir(dir);setTimeout(()=>{onResult(card.id,dir==="right");onClose();},300);};
  const down=e=>{if(exitDir)return;act.current=true;mv.current=false;sx.current=e.clientX;setDragging(true);try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}};
  const move=e=>{if(!act.current||exitDir)return;const dx=e.clientX-sx.current;if(Math.abs(dx)>8)mv.current=true;setDragX(dx);};
  const up=()=>{if(!act.current)return;act.current=false;setDragging(false);if(!mv.current){setFlipped(f=>!f);setDragX(0);return;}if(dragX>100)fin("right");else if(dragX<-100)fin("left");else setDragX(0);};

  const tint=exitDir==="right"?{c:C.green,o:0.9,t:"DONE"}:exitDir==="left"?{c:C.red,o:0.9,t:"LATER"}:dragX>0?{c:C.green,o:kh*0.85,t:"DONE"}:dragX<0?{c:C.red,o:rh*0.85,t:"LATER"}:{c:C.green,o:0,t:""};
  const tf=exitDir?("translateX("+(exitDir==="right"?560:-560)+"px) rotate("+(exitDir==="right"?24:-24)+"deg)"):("translateX("+dragX+"px) rotate("+(dragX/24)+"deg)");

      <div onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} style={{position:"relative",width:"100%",height:450,transform:tf,transition:dragging?"none":"transform .3s cubic-bezier(.2,.8,.2,1)",touchAction:"none",cursor:"grab"}}>
        <div style={{position:"absolute",inset:0,perspective:1300}}><div style={{position:"relative",width:"100%",height:"100%",transformStyle:"preserve-3d",transform:"rotateY("+(flipped?180:0)+"deg)",transition:"transform .55s cubic-bezier(.4,.15,.2,1)"}}><CardFront card={card} marked={marked} onMark={onMark} cardBase={cBase}/><CardBack card={card} marked={marked} onMark={onMark} cardBase={cBase}/></div></div>

      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:24,marginTop:18}}>
        <button onClick={()=>fin("left")} className="press" style={actionBtn(C.red,56)}><Icon name="xmark" size={22} color="#fff"/></button>
        <button onClick={()=>setFlipped(f=>!f)} className="press" style={{background:"rgba(255,255,255,0.92)",border:"none",borderRadius:"50%",width:48,height:48,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="arrows-rotate" size={17} color={C.sub}/></button>
        <button onClick={()=>fin("right")} className="press" style={actionBtn(C.green,56)}><Icon name="check" size={22} color="#fff"/></button>
      </div>
    </div>
  </div>);
}

function PointsChart({history}){
  const[mode,setMode]=useState("week");const[offset,setOffset]=useState(0);const[grow,setGrow]=useState(false);
  useEffect(()=>{setOffset(0);},[mode]);useEffect(()=>{setGrow(false);const t=setTimeout(()=>setGrow(true),40);return()=>clearTimeout(t);},[mode,offset]);
  const total=history.length;const todayIdx=total-1;const weeksAvail=Math.ceil(total/7);
  let bars=[],rangeLabel="",periodTotal=0,canPrev=false,canNext=false;
  if(mode==="week"){const end=total+offset*7,start=end-7;for(let idx=start;idx<end;idx++){if(idx<0||idx>=total){bars.push({label:"",points:0,ghost:true});continue;}const d=history[idx];bars.push({label:d.label,points:d.points,today:idx===todayIdx});periodTotal+=d.points;}rangeLabel=offset===0?"This week":history[Math.max(0,start)].dm+" - "+history[Math.min(total-1,end-1)].dm;canNext=offset<0;canPrev=-offset<weeksAvail-1;}
  else{const buckets=[];for(let e=total;e>0;e-=7){const s=Math.max(0,e-7);const slice=history.slice(s,e);buckets.push({dm:history[s].dm,points:slice.reduce((a,x)=>a+x.points,0),current:e===total});}const pages=Math.ceil(buckets.length/4);const ps=(-offset)*4;const page=buckets.slice(ps,ps+4).reverse();page.forEach(b=>{bars.push({label:b.dm,points:b.points,today:b.current});periodTotal+=b.points;});rangeLabel=offset===0?"Last 4 weeks":(page.length?page[0].dm+" - "+page[page.length-1].dm:"");canNext=offset<0;canPrev=-offset<pages-1;}
  const max=Math.max(10,...bars.map(b=>b.points));
  const nb=(dir,en,onClick)=>(<button onClick={en?onClick:undefined} disabled={!en} className="press" style={{width:32,height:32,borderRadius:10,border:"1.5px solid "+C.line,background:C.surface,cursor:en?"pointer":"default",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name={dir==="prev"?"chevron-left":"chevron-right"} size={12} color={en?C.ink:"#D8D5E8"}/></button>);
  return(<div style={{background:C.surface,borderRadius:22,padding:"18px 18px 14px",border:"1px solid "+C.line}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
      <div style={{display:"flex",background:C.bg,borderRadius:12,padding:3}}>{["week","month"].map(k=>{const on=mode===k;return(<button key={k} onClick={()=>setMode(k)} className="press" style={{padding:"7px 14px",borderRadius:10,border:"none",cursor:"pointer",background:on?C.surface:"transparent",color:on?C.primary:C.sub,fontWeight:800,fontSize:13,fontFamily:FONT,textTransform:"capitalize"}}>{k}</button>);})}</div>
      <span style={{fontSize:14,fontWeight:800,color:C.amber,display:"flex",alignItems:"center",gap:5}}><Icon name="star" size={13} color={C.amber}/>{periodTotal} pts</span>
    </div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>{nb("prev",canPrev,()=>setOffset(o=>o-1))}<span style={{fontSize:13,fontWeight:800,color:C.ink}}>{rangeLabel}</span>{nb("next",canNext,()=>setOffset(o=>o+1))}</div>
    <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",gap:8,height:100}}>{bars.map((d,i)=>{const h=grow?Math.max(d.points>0?8:3,(d.points/max)*80):3;return(<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:5,height:"100%",justifyContent:"flex-end"}}><span style={{fontSize:9.5,fontWeight:700,color:d.points?C.ink:"transparent"}}>{d.points||0}</span><div style={{width:"100%",maxWidth:26,height:h,borderRadius:6,background:d.ghost?C.line:(d.today?"linear-gradient(180deg,#6A5BFF,#A06BFF)":C.primarySoft),transition:"height .8s cubic-bezier(.2,.8,.2,1)",opacity:d.ghost?0.5:1}}/><span style={{fontSize:mode==="month"?8.5:10,fontWeight:700,color:d.today?C.primary:C.sub,whiteSpace:"nowrap"}}>{d.label}</span></div>);})}</div>
  </div>);
}

/* ── ADD FLASHCARD ── */
function AddWordModal({selectedLangs,curLevel,curChapter,onClose,onAdd}){
  const[lang,setLang]=useState(selectedLangs[0]||"fa");
  const[tg,setTg]=useState("mine");const[tl,setTl]=useState(curLevel);const[tc,setTc]=useState(curChapter);
  const[f,setF]=useState({word:"",translation:"",pron:"",example:"",exampleTranslation:"",farsi:"",farsiExample:""});
  const set=k=>v=>setF(p=>({...p,[k]:v}));const[auto,setAuto]=useState("idle");
  const autofill=async()=>{
    if(!f.word.trim()||auto==="loading")return;setAuto("loading");
    try{const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:"Respond ONLY with a single minified JSON object.",messages:[{role:"user",content:'Build a flashcard for "'+f.word.trim()+'" in '+(lang==="fa"?"Persian Finglish":"German")+'. JSON: {"word","pron","translation","example","exampleTranslation","note"'+(lang==="fa"?',"farsi","farsiExample"':'')+'}'}]})});const data=await res.json();let text=(data.content||[]).map(b=>b.text||"").join("").replace(/```json|```/g,"").trim();let obj;try{obj=JSON.parse(text);}catch(_){const m2=text.match(/\{[\s\S]*\}/);if(!m2)throw new Error();obj=JSON.parse(m2[0]);}setF({word:obj.word||f.word,translation:obj.translation||"",pron:obj.pron||"",example:obj.example||"",exampleTranslation:obj.exampleTranslation||"",farsi:obj.farsi||"",farsiExample:obj.farsiExample||""});setAuto("done");}catch(_){setAuto("error");}
  };
  const canAdd=f.word.trim()&&f.translation.trim();
  const add=()=>{if(!canAdd)return;onAdd({id:"u"+Date.now(),language:lang,level:tg==="mine"?"custom":tl,chapter:tg==="mine"?"custom":tc,word:f.word.trim(),translation:f.translation.trim(),pron:f.pron.trim(),example:f.example.trim(),exampleTranslation:f.exampleTranslation.trim(),note:"added by you",farsi:f.farsi.trim(),farsiExample:f.farsiExample.trim(),custom:tg==="mine"});onClose();};
  const inp={width:"100%",marginTop:5,padding:"11px 13px",fontSize:14.5,borderRadius:12,border:"1.5px solid "+C.line,outline:"none",fontFamily:FONT,color:C.ink,boxSizing:"border-box"};
  const lbl2={fontSize:12.5,fontWeight:700,color:C.sub,display:"block",marginTop:12};
  const groupOpts=[{value:"mine",label:"My Cards"},...LEVELS_ORDER.flatMap(lv=>CHAPTERS[lv].map(ch=>({value:lv+"|"+ch.id,label:LEVEL_LABEL[lv]+" › "+ch.title})))];
  const langOpts=[{value:"fa",label:"🇮🇷 Persian (Finglish)"},{value:"de",label:"🇩🇪 German (Deutsch)"}];
  return(<Sheet onClose={onClose} title="Add a flashcard">
    <p style={{color:C.sub,fontSize:13.5,margin:"0 0 12px"}}>Enter the word, then tap auto-fill.</p>
    {selectedLangs.length>1&&(<div style={{marginBottom:12}}><label style={lbl2}>Language</label><div style={{marginTop:5}}><AppSelect value={lang} onChange={setLang} options={langOpts}/></div></div>)}
    <label style={lbl2}>Word ({langMeta[lang].label}{lang==="fa"?", Finglish":""})</label>
    <input value={f.word} onChange={e=>set("word")(e.target.value)} placeholder={lang==="fa"?"e.g. mehraboon":"e.g. der Apfel"} style={inp}/>
    <button onClick={autofill} disabled={!f.word.trim()||auto==="loading"} className="press" style={{width:"100%",marginTop:10,padding:11,borderRadius:12,border:"1.5px solid "+C.primary+"55",background:C.primarySoft,color:C.primary,fontWeight:800,fontSize:14,cursor:f.word.trim()?"pointer":"default",fontFamily:FONT,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>{auto==="loading"?<><span className="spinner"/> Auto-filling…</>:<><Icon name="wand-magic-sparkles" size={14} color={C.primary}/> Auto-fill</>}</button>
    {auto==="done"&&<div style={{fontSize:12,color:C.green,marginTop:6,fontWeight:600}}>Filled in — edit if needed.</div>}
    {auto==="error"&&<div style={{fontSize:12,color:C.sub,marginTop:6}}>Couldn't auto-fill — fill below.</div>}
    <label style={lbl2}>Translation (English)</label><input value={f.translation} onChange={e=>set("translation")(e.target.value)} placeholder="e.g. the apple" style={inp}/>
    <label style={lbl2}>Pronunciation (optional)</label><input value={f.pron} onChange={e=>set("pron")(e.target.value)} placeholder="e.g. dair AP-fel" style={inp}/>
    <label style={lbl2}>Example sentence (optional)</label><input value={f.example} onChange={e=>set("example")(e.target.value)} placeholder="a short sentence" style={inp}/>
    <label style={lbl2}>Example translation (optional)</label><input value={f.exampleTranslation} onChange={e=>set("exampleTranslation")(e.target.value)} placeholder="its translation" style={inp}/>
    {lang==="fa"&&<><label style={lbl2}>Farsi script (optional)</label><input value={f.farsi} onChange={e=>set("farsi")(e.target.value)} placeholder="e.g. مهربون" dir="rtl" style={inp}/></>}
    <label style={lbl2}>Save to group</label>
    <div style={{marginTop:5}}>
      <AppSelect value={tg==="mine"?"mine":(tl+"|"+tc)} onChange={v=>{if(v==="mine"){setTg("mine");}else{const[lv,ch]=v.split("|");setTg("level");setTl(lv);setTc(ch);}}} options={groupOpts}/>
    </div>
    <div style={{marginTop:16}}><PrimaryButton onClick={add} disabled={!canAdd}>Add to my flashcards</PrimaryButton></div>
  </Sheet>);
}

  const save=async()=>{if(!dirty)return;if(name.trim())setUser(u=>({...u,name:cap(name.trim())}));if(langDirty){setSelectedLangs([lang]);await onLangsChanged([lang]);}setSaved(true);setTimeout(()=>setSaved(false),1800);};
  const share=async()=>{setShareMsg("Preparing…");const text="I'm learning languages with Memzy!\n⭐ "+totalPoints+" points · 🔥 "+dayStreak+"-day streak\nJoin me at memzy.app!";const r=await shareImage(cardRef.current,text,"memzy-profile.png",C.surface);setShareMsg(r==="shared"?"":r==="downloaded"?"Saved!":"Couldn't share");setTimeout(()=>setShareMsg(""),2200);};
  const lbl={fontSize:13,fontWeight:700,color:C.sub,display:"block"};const inp={width:"100%",marginTop:6,padding:"12px 13px",fontSize:15,borderRadius:12,border:"1.5px solid "+C.line,outline:"none",fontFamily:FONT,color:C.ink,boxSizing:"border-box"};
  const langOpts=[{value:"fa",label:"🇮🇷 Persian (Finglish)"},{value:"de",label:"🇩🇪 German (Deutsch)"}];
  return(<div style={{padding:"18px 20px 0",paddingBottom:"calc(24px + env(safe-area-inset-bottom))",display:"flex",flexDirection:"column",gap:14,height:"100%",boxSizing:"border-box",overflowY:"auto"}}>
    <h1 style={{fontSize:23,fontWeight:800,color:C.ink,margin:0}}>Profile</h1>
    <div style={{position:"relative",background:C.surface,borderRadius:22,border:"1px solid "+C.line,boxShadow:"0 8px 24px rgba(28,26,46,0.05)"}}>
      <button onClick={share} className="press" style={{position:"absolute",top:12,right:12,zIndex:2,width:34,height:34,borderRadius:"50%",border:"1px solid "+C.line,background:C.bg,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="arrow-up-from-bracket" size={13} color={C.primary}/></button>
      <div ref={cardRef} style={{padding:"28px 20px 22px",display:"flex",flexDirection:"column",alignItems:"center",gap:14,borderRadius:22,background:C.surface}}>
        <div style={{position:"relative",cursor:"pointer"}} onClick={()=>setPicker(true)}>
          <img src={avatarURL(user&&user.avatar)} crossOrigin="anonymous" alt="" style={{width:88,height:88,borderRadius:"50%",objectFit:"cover",border:"4px solid "+C.primarySoft,display:"block"}}/>
          <div style={{position:"absolute",right:-2,bottom:-2,width:28,height:28,borderRadius:"50%",background:C.primary,border:"3px solid "+C.surface,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="pen" size={10} color="#fff"/></div>
        </div>
        <div style={{fontSize:20,fontWeight:800,color:C.ink}}>{cap((user&&user.name)||"You")}</div>
        <div style={{display:"flex",gap:10,width:"100%"}}>
          <div style={{flex:1,background:"linear-gradient(135deg,"+C.primary+",#A06BFF)",borderRadius:18,padding:"16px 10px",textAlign:"center"}}><div style={{fontSize:11,color:"rgba(255,255,255,0.8)",fontWeight:700,marginBottom:4}}>Level</div><div style={{fontSize:22,fontWeight:900,color:"#fff"}}>{lvl}</div><div style={{fontSize:10,color:"rgba(255,255,255,0.7)",marginTop:2}}>{LEVEL_LABEL[lvl]}</div></div>
          <div style={{flex:1,background:C.amber+"18",border:"1px solid "+C.amber+"40",borderRadius:18,padding:"16px 10px",textAlign:"center"}}><div style={{fontSize:11,color:C.sub,fontWeight:700,marginBottom:4}}>Streak</div><div style={{fontSize:22,fontWeight:900,color:C.amber}}>{dayStreak}</div><div style={{fontSize:10,color:C.sub,marginTop:2}}>days</div></div>
          <div style={{flex:1,background:C.greenSoft,border:"1px solid "+C.green+"40",borderRadius:18,padding:"16px 10px",textAlign:"center"}}><div style={{fontSize:11,color:C.sub,fontWeight:700,marginBottom:4}}>Points</div><div style={{fontSize:22,fontWeight:900,color:C.green}}>{totalPoints}</div><div style={{fontSize:10,color:C.sub,marginTop:2}}>earned</div></div>
        </div>
        <div style={{fontSize:11.5,color:C.sub,textAlign:"center"}}>memzy.app · learning together</div>
      </div>
    </div>
    {shareMsg&&<div style={{textAlign:"center",fontSize:12.5,color:C.green,fontWeight:700}}>{shareMsg}</div>}
    <div style={{background:C.surface,borderRadius:18,padding:16,border:"1px solid "+C.line}}>
      <label style={lbl}>Name</label>
      <input value={name} onChange={e=>setName(e.target.value)} onBlur={e=>setName(cap(e.target.value))} placeholder="Your name" style={inp}/>
      <label style={{...lbl,marginTop:12,marginBottom:5}}>Language</label>
      <AppSelect value={lang} onChange={setLang} options={langOpts}/>
      {langDirty&&<div style={{fontSize:11.5,color:C.sub,marginTop:8}}>Changing language resets your flashcard set.</div>}
      <button onClick={save} disabled={!dirty} className="press" style={{width:"100%",marginTop:12,padding:13,borderRadius:13,border:"none",background:dirty?C.primary:C.line,color:dirty?"#fff":C.sub,fontWeight:800,cursor:dirty?"pointer":"default",fontFamily:FONT}}>{saved?"Saved ✓":"Save changes"}</button>
    </div>
    <button onClick={onSignOut} className="press" style={{padding:14,borderRadius:16,border:"1.5px solid "+C.line,background:C.surface,color:C.red,fontWeight:800,fontSize:15,cursor:"pointer",fontFamily:FONT}}>Sign out</button>
    {picker&&<AvatarPicker current={user&&user.avatar} onPick={a=>setUser(u=>({...u,avatar:a}))} onClose={()=>setPicker(false)}/>}
  </div>);
}
function AvatarPicker({current,onPick,onClose}){return(<Sheet onClose={onClose} title="Choose your character"><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>{AVATARS.map(a=>(<button key={a} onClick={()=>{onPick(a);onClose();}} className="press" style={{border:"none",background:"transparent",cursor:"pointer",display:"flex",justifyContent:"center",padding:2}}><Avatar seed={a} size={60} ring={current===a?C.primary:null}/></button>))}</div></Sheet>);}

/* ── SESSION COMPLETE ── */
const CHEERS=[(n)=>"You smashed it, "+n+"! 💥",(n)=>"On fire, "+n+"! 🔥",(n)=>"Nailed it, "+n+"! 🎉",(n)=>"Look at you go, "+n+"! ✨",(n)=>"Unstoppable, "+n+"! ⚡"];
function SessionComplete({points,dayStreak,name,level,chapterTitle,onContinue}){
  const pts=useCountUp(points);const line=useMemo(()=>CHEERS[Math.floor(Math.random()*CHEERS.length)](cap(name||"friend")),[name]);
  const[shareMsg,setShareMsg]=useState("");const capRef=useRef(null);
  useEffect(()=>{playFinishChime();},[]);
  const doShare=async()=>{setShareMsg("Preparing…");const text="Just finished a round in Memzy!\n⭐ "+points+" points · 🔥 "+dayStreak+"-day streak\n"+LEVEL_LABEL[level]+(chapterTitle?" · "+chapterTitle:"")+"\nJoin me at memzy.app!";const r=await shareImage(capRef.current,text,"memzy-result.png",C.bg);setShareMsg(r==="shared"?"":r==="downloaded"?"Image saved!":"Couldn't share");setTimeout(()=>setShareMsg(""),2200);};
  return(<div style={{position:"relative",width:"100%",height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center",background:C.bg,padding:"20px 24px",paddingBottom:"calc(24px + env(safe-area-inset-bottom))"}}>
    <Confetti/>
    <div ref={capRef} style={{display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center",padding:"24px 20px",borderRadius:28,background:C.surface,border:"1px solid "+C.line,boxShadow:"0 20px 60px rgba(28,26,46,0.12)",width:"100%",maxWidth:320,position:"relative",zIndex:10}}>
      <div className="pop" style={{width:96,height:96,borderRadius:"50%",background:"linear-gradient(135deg,"+C.amber+",#FF6B4A)",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:16,boxShadow:"0 12px 36px "+C.amber+"55"}}><Icon name="trophy" size={46} color="#fff"/></div>
      <h1 style={{fontSize:24,fontWeight:800,color:C.ink,margin:"0 0 6px",letterSpacing:-0.6}}>{line}</h1>
      <div style={{fontSize:13,color:C.sub,marginBottom:16}}>{LEVEL_LABEL[level]}{chapterTitle?" · "+chapterTitle:""}</div>
      <div style={{background:"linear-gradient(135deg,"+C.amber+"22,"+C.amber+"08)",border:"1px solid "+C.amber+"44",borderRadius:20,padding:"16px 32px",marginBottom:16}}>
        <div style={{fontSize:56,fontWeight:800,color:C.amber,letterSpacing:-2,lineHeight:1,display:"flex",alignItems:"center",gap:10}}><Icon name="star" size={40} color={C.amber}/>{pts}</div>
        <div style={{fontSize:13,color:C.sub,fontWeight:600,marginTop:4}}>points this round</div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8,background:C.redSoft,borderRadius:14,padding:"10px 20px"}}><Icon name="fire" size={18} color={C.red}/><span style={{fontSize:16,fontWeight:800,color:C.ink}}>{dayStreak} day streak!</span></div>
    </div>
    {shareMsg&&<div style={{fontSize:13,color:C.green,fontWeight:700,marginTop:12,zIndex:10}}>{shareMsg}</div>}
    <div style={{width:"100%",maxWidth:320,marginTop:20,display:"flex",flexDirection:"column",gap:10,zIndex:10}}>
      <PrimaryButton onClick={onContinue}>Continue</PrimaryButton>
      <button onClick={doShare} className="press" style={{padding:14,borderRadius:18,border:"1.5px solid "+C.line,background:C.surface,color:C.ink,fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:FONT,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><Icon name="arrow-up-from-bracket" size={14} color={C.ink}/>Share result</button>
    </div>
  </div>);
}

/* ── STYLE ── */
function StyleTag(){return(<style>{`
  @keyframes confetti{0%{transform:translateY(-20px) rotate(0);opacity:1}85%{opacity:1}100%{transform:translateY(700px) rotate(560deg);opacity:0}}
  @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes sheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes cardpop{from{transform:translateY(34px) scale(.92);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pop{animation:pop .5s cubic-bezier(.2,.8,.2,1)}
  .sheet-in{animation:sheet .3s cubic-bezier(.2,.8,.2,1)}
  .card-pop{animation:cardpop .32s cubic-bezier(.2,.8,.2,1)}
  .spinner{width:15px;height:15px;border:3px solid rgba(0,0,0,0.12);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
  .press{transition:transform .08s ease}
  .press:active{transform:scale(0.95)}
  *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
  input::placeholder{color:#B6B2CE}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-thumb{background:#ECEAF6;border-radius:4px}
`}</style>);}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
