  generateCard: async (rawWord, language) => {
    const sys = "You are a precise language-learning assistant. Respond ONLY with a single minified JSON object. No markdown, no code fences, no commentary.";
    const targetFmt = language === "fa" ? "Finglish (Latin-script transliteration of Persian, never Farsi script)" : "German (include the article der/die/das for nouns)";
    const persianExtra = language === "fa" ? ',\n"farsi": the headword in real Farsi/Persian script,\n"farsiExample": the example sentence in real Farsi/Persian script' : "";
    const prompt =
"The learner studies " + langFull(language) + '. Build a flashcard for: "' + rawWord + '".\n' +
"Return JSON with exactly these string fields:\n" +
'{"word": the headword in ' + targetFmt + ',\n"pron": a simple syllable-by-syllable pronunciation guide, stressed syllable in CAPS (e.g. "sa-LÂM"),\n"translation": concise English meaning,\n"example": one short natural sentence in ' + (language === "fa" ? "Finglish" : "German") + ',\n"exampleTranslation": English translation,\n"note": part of speech' + (language === "de" ? " plus gender for nouns" : "") + ',\n"imageWord": 1-2 simple English keywords for a photo, comma-separated' + persianExtra + "}";
    const res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, system: sys, messages: [{ role: "user", content: prompt }] }) });
    const data = await res.json();
    let text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    text = text.replace(/```json/gi, "").replace(/```/g, "").trim();
    let obj; try { obj = JSON.parse(text); } catch (_) { const m = text.match(/\{[\s\S]*\}/); if (!m) throw new Error("parse"); obj = JSON.parse(m[0]); }
    return { id: "u" + Date.now(), language, word: obj.word || rawWord, pron: obj.pron || "", translation: obj.translation || "", example: obj.example || "", exampleTranslation: obj.exampleTranslation || "", note: obj.note || "", imageWord: obj.imageWord || obj.translation || rawWord, farsi: obj.farsi || "", farsiExample: obj.farsiExample || "", custom: true };
  },
};

/* ===================== AUDIO: TTS (network first, synth fallback) ===================== */
let _voices = [];
const loadVoices = () => { try { _voices = window.speechSynthesis.getVoices() || []; } catch (_) {} };
if (typeof window !== "undefined" && "speechSynthesis" in window) { loadVoices(); try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch (_) {} }
const pickVoice = (prefix) => { if (!_voices.length) loadVoices(); return _voices.find((v) => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith(prefix)) || null; };
function speakSynth(text, langCode) { try { if (!("speechSynthesis" in window)) return; window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = langCode; const v = pickVoice(langCode.slice(0, 2).toLowerCase()); if (v) u.voice = v; u.rate = 0.85; window.speechSynthesis.speak(u); } catch (_) {} }
let _ttsAudio = null;
function speakNetwork(text, tl) {
  return new Promise((resolve, reject) => {
    try {
      if (_ttsAudio) { try { _ttsAudio.pause(); } catch (_) {} }
      const url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=" + tl + "&q=" + encodeURIComponent(text);
      _ttsAudio = new Audio(url);
      _ttsAudio.onerror = () => reject();
      const p = _ttsAudio.play();
      if (p && p.then) p.then(() => resolve()).catch(() => reject()); else resolve();
    } catch (_) { reject(); }
  });
}
function speak(text, langCode) {
  const tl = (langCode && langCode.toLowerCase().startsWith("fa")) ? "fa" : "de";
  speakNetwork(text, tl).catch(() => speakSynth(text, langCode));
}

/* ===================== AUDIO: chime ===================== */
function playChime() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
    const ctx = new Ctx(); if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime; const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.type = "triangle"; o.frequency.value = f; const t = now + i * 0.11; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.22, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5); o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.55); });
    const so = ctx.createOscillator(); const sg = ctx.createGain(); so.type = "sine"; so.frequency.setValueAtTime(1318.5, now + 0.5); so.frequency.linearRampToValueAtTime(2093, now + 0.72); sg.gain.setValueAtTime(0, now + 0.5); sg.gain.linearRampToValueAtTime(0.14, now + 0.54); sg.gain.exponentialRampToValueAtTime(0.0001, now + 0.95); so.connect(sg); sg.connect(ctx.destination); so.start(now + 0.5); so.stop(now + 1);
    setTimeout(() => { try { ctx.close(); } catch (_) {} }, 1400);
  } catch (_) {}
}

/* ===================== history ===================== */
function buildHistory() { const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]; const seed = [10, 14, 9, 18, 12, 16, 0]; const now = new Date(); const out = []; for (let i = 6; i >= 0; i--) { const d = new Date(now); d.setDate(now.getDate() - i); out.push({ label: days[d.getDay()], points: seed[6 - i] }); } return out; }
function calcStreak(h) { let i = h.length - 1; if (h[i].points === 0) i--; let s = 0; for (; i >= 0; i--) { if (h[i].points > 0) s++; else break; } return s; }

function useCountUp(target, duration) { duration = duration || 700; const [val, setVal] = useState(0); useEffect(() => { let raf; const start = performance.now(); const tick = (now) => { const p = Math.min(1, (now - start) / duration); setVal(Math.round(target * easeOut(p))); if (p < 1) raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf); }, [target, duration]); return val; }

    </div>

}

function Confetti() {
  const pieces = useMemo(() => { const colors = [C.primary, C.green, C.fa, C.de, C.amber, "#A06BFF"]; return Array.from({ length: 60 }, (_, i) => ({ id: i, left: Math.random() * 100, delay: Math.random() * 0.5, dur: 2.4 + Math.random() * 1.6, size: 7 + Math.random() * 8, color: colors[i % colors.length], rot: Math.random() * 360, round: Math.random() > 0.5 })); }, []);
  return (<div style={{ position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none", zIndex: 50 }}>{pieces.map((p) => (<div key={p.id} style={{ position: "absolute", top: "-20px", left: p.left + "%", width: p.size, height: p.size, background: p.color, borderRadius: p.round ? "50%" : "2px", transform: "rotate(" + p.rot + "deg)", animation: "confetti " + p.dur + "s " + p.delay + "s linear infinite" }} />))}</div>);
}

function Ring({ pct, color, size = 84, stroke = 9, label, value }) {
  const r = (size - stroke) / 2, circ = 2 * Math.PI * r, off = circ * (1 - pct);
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
      <div style={{ position: "relative", width: size, height: size }}>
        <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}><circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.line} strokeWidth={stroke} /><circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={off} style={{ transition: "stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)" }} /></svg>
        <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, color: C.ink, fontSize: 15 }}>{value}</div>
      </div>
      <span style={{ fontSize: 13, color: C.sub, fontWeight: 600 }}>{label}</span>
    </div>
  );
}

  const [tab, setTab] = useState("dashboard");          // dashboard | mywords | friends
  const [selectedLangs, setSelectedLangs] = useState([]);
  const [user, setUser] = useState(null);
  const [allCards, setAllCards] = useState([]);
  const [learnedIds, setLearnedIds] = useState([]);
  const [queue, setQueue] = useState([]);
  const [reviewCount, setReviewCount] = useState(0);
  const [roundPoints, setRoundPoints] = useState(0);
  const [history, setHistory] = useState(() => buildHistory());
  const dayStreak = useMemo(() => calcStreak(history), [history]);
  const totalPoints = useMemo(() => history.reduce((a, d) => a + d.points, 0), [history]);
  const committed = useRef(false);
  const remaining = useMemo(() => allCards.filter((c) => !learnedIds.includes(c.id)), [allCards, learnedIds]);
  const initData = async (langs) => { const words = await dataService.fetchWords(langs); setAllCards(words); setLearnedIds([]); setQueue([]); };

  const startSession = (review) => { const pool = review || remaining.length === 0 ? allCards : remaining; setQueue(shuffle(pool)); setReviewCount(0); setRoundPoints(0); committed.current = false; setFlipped(false); setDragX(0); setExitDir(null); setScreen("deck"); };
  const commitRound = (pts) => { if (pts <= 0) return; setHistory((h) => { const c = [...h]; c[c.length - 1] = { ...c[c.length - 1], points: c[c.length - 1].points + pts }; return c; }); };
  useEffect(() => { if (screen === "deck" && allCards.length > 0 && queue.length === 0 && !committed.current) { committed.current = true; commitRound(roundPoints); } }, [screen, queue.length, roundPoints, allCards.length]);
  const exitToApp = () => { if (!committed.current && roundPoints > 0) { committed.current = true; commitRound(roundPoints); } setTab("dashboard"); setScreen("app"); };

  const [flipped, setFlipped] = useState(false);
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const [exitDir, setExitDir] = useState(null);
  const startX = useRef(0); const startY = useRef(0); const moved = useRef(false); const active = useRef(false); const locked = useRef(false);

  const commitSwipe = (dir) => {
    setQueue((q) => { if (!q.length) return q; const top = q[0], rest = q.slice(1); if (dir === "right") { setLearnedIds((ids) => (ids.includes(top.id) ? ids : [...ids, top.id])); setRoundPoints((p) => p + 1); dataService.saveProgress({ userId: user && user.id, cardId: top.id, status: "known" }); return rest; } setReviewCount((c) => c + 1); dataService.saveProgress({ userId: user && user.id, cardId: top.id, status: "review" }); return [...rest, top]; });
    setFlipped(false); setDragX(0); setExitDir(null); locked.current = false;
  };
  const triggerSwipe = (dir) => { if (locked.current || queue.length === 0) return; locked.current = true; setExitDir(dir); setDragging(false); setTimeout(() => commitSwipe(dir), 320); };
  const onPointerDown = (e) => { if (exitDir) return; active.current = true; moved.current = false; startX.current = e.clientX; startY.current = e.clientY; setDragging(true); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} };
  const onPointerMove = (e) => { if (!active.current || exitDir) return; const dx = e.clientX - startX.current, dy = e.clientY - startY.current; if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved.current = true; setDragX(dx); };
  const onPointerUp = () => { if (!active.current) return; active.current = false; setDragging(false); if (!moved.current) { setFlipped((f) => !f); setDragX(0); return; } if (dragX > 110) triggerSwipe("right"); else if (dragX < -110) triggerSwipe("left"); else setDragX(0); };

  const addCard = (card) => { setAllCards((prev) => [...prev, card]); };
  const deleteCard = (id) => { setAllCards((p) => p.filter((c) => c.id !== id)); setQueue((q) => q.filter((c) => c.id !== id)); setLearnedIds((ids) => ids.filter((x) => x !== id)); };

  /* ---- ONBOARDING ---- */
  if (screen === "onboarding") {
    const toggle = (l) => setSelectedLangs((s) => (s.includes(l) ? s.filter((x) => x !== l) : [...s, l]));
    return (
      <Shell><StyleTag />
        <div style={{ padding: "52px 24px 28px", display: "flex", flexDirection: "column", flex: 1 }}>
          <div style={{ fontSize: 40 }}>👋</div>
          <h1 style={{ fontSize: 30, fontWeight: 800, color: C.ink, margin: "16px 0 6px", letterSpacing: -0.8, lineHeight: 1.15 }}>What do you<br />want to learn?</h1>
          <p style={{ color: C.sub, margin: 0, fontSize: 15.5 }}>Pick one or both. You can change this later.</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 14, marginTop: 28 }}>
            {["fa", "de"].map((l) => { const m = langMeta[l]; const on = selectedLangs.includes(l); return (
              <button key={l} onClick={() => toggle(l)} className="press" style={{ display: "flex", alignItems: "center", gap: 16, padding: "18px 18px", borderRadius: 20, cursor: "pointer", textAlign: "left", background: C.surface, border: on ? "2px solid " + m.color : "2px solid " + C.line, boxShadow: on ? "0 10px 24px " + m.color + "33" : "0 2px 10px rgba(20,20,50,0.04)", transition: "all .2s cubic-bezier(.2,.8,.2,1)", fontFamily: FONT }}>
                <div style={{ width: 52, height: 52, borderRadius: 16, background: m.soft, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, flexShrink: 0 }}>{m.flag}</div>
                <div style={{ flex: 1 }}><div style={{ fontSize: 18, fontWeight: 800, color: C.ink }}>{m.label}</div><div style={{ fontSize: 13.5, color: C.sub, fontWeight: 500 }}>{m.sub} · 15 starter words</div></div>
                <div style={{ width: 26, height: 26, borderRadius: "50%", border: on ? "none" : "2px solid " + C.line, background: on ? m.color : "transparent", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900, fontSize: 14 }}>{on ? "✓" : ""}</div>
              </button>); })}
          </div>
          <div style={{ flex: 1 }} />
          <PrimaryButton disabled={!selectedLangs.length} onClick={() => setScreen("signin")}>{selectedLangs.length === 2 ? "Learn both →" : "Continue →"}</PrimaryButton>
        </div>
      </Shell>
    );
  }

  /* ---- SIGN IN ---- */
  if (screen === "signin") return <SignIn onDone={async (u) => { setUser(u); await initData(selectedLangs); setTab("dashboard"); setScreen("app"); }} />;

  /* ---- DECK ---- */
  if (screen === "deck") {
    const current = queue[0]; const sessionDone = queue.length === 0; const totalChosen = allCards.length;
    const knowHint = Math.max(0, Math.min(1, dragX / 110)); const reviewHint = Math.max(0, Math.min(1, -dragX / 110));
    const topTransform = exitDir ? ("translateX(" + (exitDir === "right" ? 640 : -640) + "px) rotate(" + (exitDir === "right" ? 26 : -26) + "deg)") : ("translateX(" + dragX + "px) rotate(" + (dragX / 22) + "deg)");
    const topTransition = dragging ? "none" : "transform .34s cubic-bezier(.2,.8,.2,1)";
    const tint = exitDir === "right" ? { c: C.green, o: 0.92, t: "KNOW" } : exitDir === "left" ? { c: C.red, o: 0.92, t: "REVIEW" } : dragX > 0 ? { c: C.green, o: knowHint * 0.85, t: "KNOW" } : dragX < 0 ? { c: C.red, o: reviewHint * 0.85, t: "REVIEW" } : { c: C.green, o: 0, t: "" };
    return (
      <Shell><StyleTag />
        <div style={{ padding: "18px 18px 4px", display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={exitToApp} className="press" aria-label="Exit" style={{ background: C.surface, border: "1.5px solid " + C.line, borderRadius: 14, width: 44, height: 44, fontSize: 18, cursor: "pointer", color: C.ink, fontWeight: 700 }}>✕</button>
          <div style={{ flex: 1 }}>
            <div style={{ height: 10, background: C.line, borderRadius: 8, overflow: "hidden" }}><div style={{ width: (totalChosen ? (learnedIds.length / totalChosen) * 100 : 0) + "%", height: "100%", background: C.primary, borderRadius: 8, transition: "width .4s cubic-bezier(.2,.8,.2,1)" }} /></div>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.sub, marginTop: 5 }}>{queue.length} left this round</div>
          </div>
          <div style={{ background: C.amber + "1A", border: "1.5px solid " + C.amber + "44", borderRadius: 14, padding: "8px 12px", fontWeight: 800, fontSize: 15, color: C.amber }}>⭐ {roundPoints}</div>
        </div>
        <div style={{ flex: 1, position: "relative", display: "flex", alignItems: "center", justifyContent: "center", padding: "8px 20px 0", minHeight: 480 }}>
          {sessionDone ? (<SessionComplete points={roundPoints} reviews={reviewCount} dayStreak={dayStreak} name={user && user.name} onAgain={() => startSession(true)} onDashboard={exitToApp} />) : (
            <div style={{ position: "relative", width: "100%", maxWidth: 360, height: 470, margin: "0 auto" }}>
              {queue.slice(1, 3).map((card, i) => { const d = i + 1; return (<div key={card.id} style={{ position: "absolute", inset: 0, transform: "translateY(" + (d * 13) + "px) scale(" + (1 - d * 0.045) + ")", zIndex: 1 }}><div style={{ ...cardBase, border: "1px solid " + C.line }} /></div>); })}
              {current && (
                <div key={current.id} onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp} style={{ position: "absolute", inset: 0, zIndex: 5, transform: topTransform, transition: topTransition, touchAction: "none", cursor: "grab" }}>
                  <div style={{ position: "relative", width: "100%", height: "100%" }}>
                    <div style={{ position: "absolute", inset: 0, perspective: 1300 }}>
                      <div style={{ position: "relative", width: "100%", height: "100%", transformStyle: "preserve-3d", transform: "rotateY(" + (flipped ? 180 : 0) + "deg)", transition: "transform .55s cubic-bezier(.4,.15,.2,1)" }}>
                        <CardFront card={current} /><CardBack card={current} />
                      </div>
                    </div>
                    <div style={{ position: "absolute", inset: 0, borderRadius: 28, background: tint.c, opacity: tint.o, display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none", transition: dragging ? "none" : "opacity .22s ease", zIndex: 6 }}>
                      {tint.t && <span style={{ color: "#fff", fontWeight: 900, fontSize: 38, letterSpacing: 3, transform: "scale(" + (0.8 + tint.o * 0.3) + ")", textShadow: "0 2px 8px rgba(0,0,0,0.15)" }}>{tint.t}</span>}
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
        {!sessionDone && (
          <div style={{ padding: "10px 24px 30px", display: "flex", alignItems: "center", justifyContent: "center", gap: 28 }}>
            <button onClick={() => triggerSwipe("left")} className="press" style={actionBtn(C.red)} aria-label="Review">✗</button>
            <button onClick={() => setFlipped((f) => !f)} className="press" style={{ background: "transparent", border: "none", color: C.sub, fontSize: 13, fontWeight: 700, cursor: "pointer", letterSpacing: 0.3 }}>FLIP ↻</button>
            <button onClick={() => triggerSwipe("right")} className="press" style={actionBtn(C.green)} aria-label="I know this">✓</button>
          </div>
        )}
      </Shell>
    );
  }

  /* ---- TABBED APP (dashboard / mywords / friends) ---- */
  return (
    <Shell><StyleTag />
      <div style={{ flex: 1, overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
        {tab === "dashboard" && <Dashboard user={user} allCards={allCards} learnedIds={learnedIds} remaining={remaining} dayStreak={dayStreak} history={history} totalPoints={totalPoints} selectedLangs={selectedLangs} setSelectedLangs={setSelectedLangs} onStart={() => startSession(false)} onReview={() => startSession(true)} onLangsChanged={async (langs) => { await initData(langs); }} onAvatar={(seed) => setUser((u) => ({ ...u, avatar: seed }))} />}
        {tab === "mywords" && <MyWordsPage allCards={allCards} learnedIds={learnedIds} selectedLangs={selectedLangs} onAdd={addCard} onDelete={deleteCard} />}
        {tab === "friends" && <FriendsPage />}
      </div>
      <TabBar tab={tab} setTab={setTab} />
    </Shell>
  );
}

/* ===================== TAB BAR ===================== */

  const goEmail = async () => { if (!email.includes("@") || loading) return; setLoading(true); const u = await dataService.signInWithEmail(email, name); onDone({ ...u, avatar }); };
  const goGoogle = async () => { if (loading) return; setLoading(true); const u = await dataService.signInWithGoogle(name); onDone({ ...u, avatar }); };

    <Shell><StyleTag />
      <div style={{ padding: "44px 24px", display: "flex", flexDirection: "column", flex: 1 }}>

        </div>
        <div style={{ background: C.surface, borderRadius: 24, padding: 22, marginTop: 18, border: "1px solid " + C.line, boxShadow: "0 8px 28px rgba(28,26,46,0.06)" }}>
          <label style={{ fontSize: 13, fontWeight: 700, color: C.sub }}>Your name</label>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Milad" disabled={loading} style={inputStyle} />

          <div style={{ marginTop: 14 }}><PrimaryButton disabled={loading} onClick={goEmail}>{loading ? "Signing in…" : "Continue with Email"}</PrimaryButton></div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "16px 0" }}><div style={{ flex: 1, height: 1, background: C.line }} /><span style={{ fontSize: 12, color: C.sub, fontWeight: 700 }}>OR</span><div style={{ flex: 1, height: 1, background: C.line }} /></div>
          <button onClick={goGoogle} disabled={loading} className="press" style={{ width: "100%", padding: 13, borderRadius: 14, border: "1.5px solid " + C.line, background: C.surface, color: C.ink, fontWeight: 700, fontSize: 15, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 10, fontFamily: FONT }}><span style={{ fontSize: 17, fontWeight: 900, color: "#4285F4" }}>G</span> Continue with Google</button>
        </div>
      </div>
    </Shell>
  );
}

/* ===================== DASHBOARD ===================== */
function Dashboard({ user, allCards, learnedIds, remaining, dayStreak, history, totalPoints, selectedLangs, setSelectedLangs, onStart, onReview, onLangsChanged, onAvatar }) {
  const learned = useCountUp(learnedIds.length); const left = useCountUp(remaining.length); const streak = useCountUp(dayStreak);
  const [editLangs, setEditLangs] = useState(false); const [picker, setPicker] = useState(false);
  const allDone = remaining.length === 0 && allCards.length > 0;
  const perLang = ["fa", "de"].map((l) => { const total = allCards.filter((c) => c.language === l).length; const done = allCards.filter((c) => c.language === l && learnedIds.includes(c.id)).length; return { l, total, done }; }).filter((x) => x.total > 0);
  const toggleLang = (l) => setSelectedLangs((s) => (s.includes(l) ? (s.length > 1 ? s.filter((x) => x !== l) : s) : [...s, l]));
  return (
    <div style={{ padding: "24px 20px 28px", display: "flex", flexDirection: "column", gap: 18 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
        <button onClick={() => setPicker(true)} className="press" style={{ border: "none", background: "transparent", padding: 0, cursor: "pointer" }}><Avatar seed={user && user.avatar} size={52} ring={C.primary} /></button>
        <div style={{ flex: 1 }}><div style={{ fontSize: 13, color: C.sub, fontWeight: 600 }}>Welcome back</div><h1 style={{ fontSize: 22, fontWeight: 800, color: C.ink, margin: 0, letterSpacing: -0.5 }}>{(user && user.name) || "there"} 👋</h1></div>
        <button onClick={() => setEditLangs((v) => !v)} className="press" style={{ background: C.surface, border: "1.5px solid " + C.line, borderRadius: 12, width: 42, height: 42, fontSize: 18, cursor: "pointer" }}>⚙️</button>
      </div>
      {editLangs && (<div style={{ background: C.surface, border: "1px solid " + C.line, borderRadius: 18, padding: 14, display: "flex", gap: 10 }}>{["fa", "de"].map((l) => { const m = langMeta[l]; const on = selectedLangs.includes(l); return (<button key={l} onClick={() => toggleLang(l)} className="press" style={{ flex: 1, padding: "12px", borderRadius: 14, border: on ? "2px solid " + m.color : "2px solid " + C.line, background: on ? m.soft : C.surface, cursor: "pointer", fontFamily: FONT, fontWeight: 700, color: C.ink, fontSize: 14 }}>{m.flag} {m.label}{on ? " ✓" : ""}</button>); })}<button onClick={async () => { await onLangsChanged(selectedLangs); setEditLangs(false); }} className="press" style={{ padding: "0 16px", borderRadius: 14, border: "none", background: C.primary, color: "#fff", fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>Save</button></div>)}
      <div style={{ background: C.surface, borderRadius: 22, padding: 20, border: "1px solid " + C.line, boxShadow: "0 8px 24px rgba(28,26,46,0.05)", display: "flex", justifyContent: "space-around" }}><Stat big={learned} label="Learned" color={C.green} /><Divider /><Stat big={left} label="To learn" color={C.primary} /><Divider /><Stat big={streak} label="Day streak 🔥" color={C.amber} /></div>
      <PointsChart history={history} total={totalPoints} />
      {perLang.length > 0 && <div style={{ background: C.surface, borderRadius: 22, padding: 22, border: "1px solid " + C.line, display: "flex", justifyContent: "space-around", gap: 14, flexWrap: "wrap" }}>{perLang.map(({ l, total, done }) => { const m = langMeta[l]; return <Ring key={l} pct={total ? done / total : 0} color={m.color} value={done + "/" + total} label={m.flag + " " + m.label} />; })}</div>}
      <PrimaryButton onClick={allDone ? onReview : onStart}>{allDone ? "Review all again 🔁" : "Start learning →"}</PrimaryButton>
      {picker && <AvatarPicker current={user && user.avatar} onPick={onAvatar} onClose={() => setPicker(false)} />}
    </div>
  );
}

function PointsChart({ history, total }) {
  const max = Math.max(10, ...history.map((d) => d.points)); const [grow, setGrow] = useState(false);
  useEffect(() => { const t = setTimeout(() => setGrow(true), 60); return () => clearTimeout(t); }, []);
  return (
    <div style={{ background: C.surface, borderRadius: 22, padding: "18px 18px 14px", border: "1px solid " + C.line, boxShadow: "0 8px 24px rgba(28,26,46,0.05)" }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 14 }}><span style={{ fontSize: 15, fontWeight: 800, color: C.ink }}>Points this week</span><span style={{ fontSize: 14, fontWeight: 800, color: C.amber }}>⭐ {total} pts</span></div>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 8, height: 104 }}>
        {history.map((d, i) => { const today = i === history.length - 1; const h = grow ? Math.max(d.points > 0 ? 8 : 3, (d.points / max) * 88) : 3; return (
          <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6, height: "100%", justifyContent: "flex-end" }}>
            <span style={{ fontSize: 10.5, fontWeight: 700, color: d.points ? C.ink : "transparent" }}>{d.points || 0}</span>
            <div style={{ width: "100%", maxWidth: 26, height: h, borderRadius: 8, background: today ? "linear-gradient(180deg,#6A5BFF,#A06BFF)" : C.primarySoft, transition: "height .8s cubic-bezier(.2,.8,.2,1)", boxShadow: today ? "0 4px 12px " + C.primary + "55" : "none" }} />
            <span style={{ fontSize: 11, fontWeight: 700, color: today ? C.primary : C.sub }}>{d.label}</span>
          </div>); })}
      </div>
    </div>
  );
}
function Stat({ big, label, color }) { return (<div style={{ textAlign: "center", minWidth: 60 }}><div style={{ fontSize: 30, fontWeight: 800, color: color, letterSpacing: -1 }}>{big}</div><div style={{ fontSize: 12.5, color: C.sub, fontWeight: 600 }}>{label}</div></div>); }
function Divider() { return <div style={{ width: 1, background: C.line }} />; }

/* ===================== MY WORDS PAGE ===================== */
function MyWordsPage({ allCards, learnedIds, selectedLangs, onAdd, onDelete }) {
  const [adding, setAdding] = useState(false); const [filter, setFilter] = useState("all");
  const langsPresent = ["fa", "de"].filter((l) => allCards.some((c) => c.language === l));
  const shown = allCards.filter((c) => filter === "all" || c.language === filter);
  return (
    <div style={{ padding: "24px 20px 28px", display: "flex", flexDirection: "column", gap: 16 }}>
      <h1 style={{ fontSize: 24, fontWeight: 800, color: C.ink, margin: 0, letterSpacing: -0.6 }}>My Words</h1>
      <button onClick={() => setAdding(true)} className="press" style={{ padding: 15, borderRadius: 18, border: "2px dashed " + C.primary + "55", background: C.primarySoft, color: C.primary, fontSize: 15.5, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>＋ Add a word (auto-builds the card)</button>
      {langsPresent.length > 1 && (
        <div style={{ display: "flex", gap: 8 }}>
          {[{ k: "all", t: "All" }].concat(langsPresent.map((l) => ({ k: l, t: langMeta[l].flag + " " + langMeta[l].label }))).map((o) => { const on = filter === o.k; return (<button key={o.k} onClick={() => setFilter(o.k)} className="press" style={{ padding: "8px 14px", borderRadius: 20, border: "1.5px solid " + (on ? C.primary : C.line), background: on ? C.primarySoft : C.surface, color: on ? C.primary : C.sub, fontWeight: 700, fontSize: 13.5, cursor: "pointer", fontFamily: FONT }}>{o.t}</button>); })}
        </div>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
        {shown.length === 0 && <div style={{ color: C.sub, fontSize: 14, textAlign: "center", padding: 20 }}>No words yet — add your first one above.</div>}
        {shown.map((c) => { const m = langMeta[c.language]; const done = learnedIds.includes(c.id); return (
          <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 12, background: C.surface, border: "1px solid " + C.line, borderRadius: 16, padding: "12px 14px" }}>
            <SpeakBtn text={sayWordOf(c)} lang={m.ttsLang} color={m.color} size={36} />
            <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontWeight: 800, color: C.ink, fontSize: 15.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.word} {c.custom && <span style={{ fontSize: 10, color: C.primary, fontWeight: 800 }}>NEW</span>}</div><div style={{ fontSize: 13, color: C.sub, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.pron ? ("/ " + c.pron + " / · ") : ""}{c.translation}</div></div>
            {done && <span style={{ fontSize: 13, color: C.green, fontWeight: 800 }}>✓ learned</span>}
            <button onClick={() => onDelete(c.id)} className="press" aria-label="Remove" style={{ background: "transparent", border: "none", color: C.sub, cursor: "pointer", fontSize: 16, padding: 4 }}>✕</button>
          </div>); })}
      </div>
      {adding && <AddWordModal selectedLangs={selectedLangs.length ? selectedLangs : langsPresent} onClose={() => setAdding(false)} onAdd={onAdd} />}
    </div>
  );
}

/* ===================== FRIENDS PAGE ===================== */
function FriendsPage() {
  const [q, setQ] = useState(""); const [results, setResults] = useState(MOCK_USERS); const [loading, setLoading] = useState(false); const [sel, setSel] = useState(null);
  useEffect(() => { let act = true; setLoading(true); dataService.searchUsers(q).then((r) => { if (act) { setResults(r); setLoading(false); } }); return () => { act = false; }; }, [q]);
  return (
    <div style={{ padding: "24px 20px 28px", display: "flex", flexDirection: "column", gap: 16 }}>
      <h1 style={{ fontSize: 24, fontWeight: 800, color: C.ink, margin: 0, letterSpacing: -0.6 }}>Friends</h1>
      <div style={{ position: "relative" }}>
        <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)", fontSize: 16 }}>🔍</span>
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search learners by name…" style={{ width: "100%", padding: "13px 15px 13px 40px", fontSize: 15, borderRadius: 14, border: "1.5px solid " + C.line, outline: "none", fontFamily: FONT, color: C.ink, boxSizing: "border-box" }} />
      </div>
      {loading && <div style={{ color: C.sub, fontSize: 13, fontWeight: 600 }}><span className="spinner" /> searching…</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
        {results.length === 0 && !loading && <div style={{ color: C.sub, fontSize: 14, textAlign: "center", padding: 20 }}>No learners match “{q}”.</div>}
        {results.map((u) => { const total = u.fa.done + u.de.done; return (
          <button key={u.id} onClick={() => setSel(u)} className="press" style={{ display: "flex", alignItems: "center", gap: 13, background: C.surface, border: "1px solid " + C.line, borderRadius: 16, padding: "12px 14px", cursor: "pointer", textAlign: "left", fontFamily: FONT }}>
            <Avatar seed={u.avatar} size={46} />
            <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontWeight: 800, color: C.ink, fontSize: 16 }}>{u.name}</div><div style={{ fontSize: 12.5, color: C.sub, fontWeight: 600 }}>🔥 {u.streak} · ⭐ {u.points} · {total} learned</div></div>
            <span style={{ color: C.sub, fontSize: 18 }}>›</span>
          </button>); })}
      </div>
      {sel && <FriendDetail user={sel} onClose={() => setSel(null)} />}
    </div>
  );
}
function FriendDetail({ user, onClose }) {
  const langs = ["fa", "de"].filter((l) => user[l].total > 0);
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(20,18,40,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 100 }}>
      <div onClick={(e) => e.stopPropagation()} className="sheet-in" style={{ width: "100%", maxWidth: 440, background: C.surface, borderRadius: "26px 26px 0 0", padding: 22, fontFamily: FONT }}>
        <div style={{ width: 40, height: 5, background: C.line, borderRadius: 4, margin: "0 auto 16px" }} />
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <Avatar seed={user.avatar} size={64} ring={C.primary} />
          <div><div style={{ fontSize: 22, fontWeight: 800, color: C.ink }}>{user.name}</div><div style={{ fontSize: 13, color: C.sub, fontWeight: 600 }}>🔥 {user.streak}-day streak · ⭐ {user.points} pts</div></div>
        </div>
        <div style={{ marginTop: 18, background: "#FBFAFF", border: "1px solid " + C.line, borderRadius: 18, padding: 18, display: "flex", justifyContent: "space-around", gap: 14, flexWrap: "wrap" }}>
          {langs.map((l) => { const m = langMeta[l]; const d = user[l]; return <Ring key={l} pct={d.total ? d.done / d.total : 0} color={m.color} value={d.done + "/" + d.total} label={m.flag + " " + m.label} />; })}
        </div>
        <button onClick={onClose} className="press" style={{ width: "100%", marginTop: 18, padding: 14, borderRadius: 16, border: "1.5px solid " + C.line, background: C.surface, color: C.ink, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>Close</button>
      </div>
    </div>
  );
}

/* ===================== ADD WORD MODAL ===================== */
function AddWordModal({ selectedLangs, onClose, onAdd }) {
  const [lang, setLang] = useState(selectedLangs[0] || "fa"); const [input, setInput] = useState(""); const [status, setStatus] = useState("idle"); const [card, setCard] = useState(null); const [err, setErr] = useState(""); const m = langMeta[lang];
  const generate = async () => { if (!input.trim() || status === "loading") return; setStatus("loading"); setErr(""); try { const c = await dataService.generateCard(input.trim(), lang); setCard(c); setStatus("preview"); } catch (e) { setErr("Couldn't build that card — try again or reword it."); setStatus("error"); } };
  const confirm = () => { if (card) { onAdd(card); onClose(); } };
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(20,18,40,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 100 }}>
      <div onClick={(e) => e.stopPropagation()} className="sheet-in" style={{ width: "100%", maxWidth: 440, background: C.surface, borderRadius: "26px 26px 0 0", padding: 22, maxHeight: "88vh", overflowY: "auto", fontFamily: FONT }}>
        <div style={{ width: 40, height: 5, background: C.line, borderRadius: 4, margin: "0 auto 16px" }} />
        <h2 style={{ fontSize: 20, fontWeight: 800, color: C.ink, margin: "0 0 4px", letterSpacing: -0.4 }}>Add a word</h2>
        <p style={{ color: C.sub, fontSize: 14, margin: "0 0 16px" }}>Type a word — translation, example, pronunciation & photo are filled in for you.</p>
        {selectedLangs.length > 1 && (<div style={{ display: "flex", gap: 10, marginBottom: 14 }}>{selectedLangs.map((l) => { const lm = langMeta[l]; const on = lang === l; return <button key={l} onClick={() => setLang(l)} className="press" style={{ flex: 1, padding: "10px", borderRadius: 12, border: on ? "2px solid " + lm.color : "2px solid " + C.line, background: on ? lm.soft : C.surface, fontWeight: 700, color: C.ink, cursor: "pointer", fontFamily: FONT }}>{lm.flag} {lm.label}</button>; })}</div>)}
        <div style={{ display: "flex", gap: 10 }}>
          <input value={input} onChange={(e) => setInput(e.target.value)} placeholder={lang === "fa" ? "e.g. mehraboon" : "e.g. der Apfel"} disabled={status === "loading"} onKeyDown={(e) => e.key === "Enter" && generate()} style={{ flex: 1, padding: "13px 15px", fontSize: 15, borderRadius: 14, border: "1.5px solid " + C.line, outline: "none", fontFamily: FONT, color: C.ink }} />
          <button onClick={generate} disabled={status === "loading" || !input.trim()} className="press" style={{ padding: "0 18px", borderRadius: 14, border: "none", background: input.trim() ? C.primary : C.line, color: "#fff", fontWeight: 800, cursor: input.trim() ? "pointer" : "default", fontFamily: FONT }}>{status === "loading" ? "…" : "Build"}</button>
        </div>
        {status === "loading" && <div style={{ display: "flex", alignItems: "center", gap: 10, color: C.sub, fontSize: 14, fontWeight: 600, marginTop: 18 }}><span className="spinner" /> Generating your flashcard…</div>}
        {status === "error" && <div style={{ color: C.red, fontSize: 14, fontWeight: 600, marginTop: 14 }}>{err}</div>}
        {status === "preview" && card && (
          <div style={{ marginTop: 18 }}>
            <div style={{ background: "#FBFAFF", border: "1px solid " + C.line, borderRadius: 18, padding: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}><div style={{ flex: 1 }}><div style={{ fontSize: 22, fontWeight: 800, color: C.ink }}>{card.word}</div>{card.pron && <div style={{ fontSize: 13, color: C.sub, fontWeight: 600 }}>/ {card.pron} /</div>}</div><SpeakBtn text={sayWordOf(card)} lang={m.ttsLang} color={m.color} size={36} /></div>
              <div style={{ marginTop: 8, display: "flex", gap: 12 }}><div style={{ width: 88, flexShrink: 0 }}><WordImage card={card} soft={m.soft} height={88} /></div><div style={{ flex: 1 }}><div style={{ fontSize: 11, color: m.color, fontWeight: 800, textTransform: "uppercase" }}>Meaning</div><div style={{ fontSize: 18, fontWeight: 800, color: C.ink }}>{card.translation}</div><div style={{ fontSize: 12.5, color: C.sub, fontWeight: 600, marginTop: 4 }}>{card.note}</div></div></div>
              <div style={{ marginTop: 10, fontSize: 14, color: C.ink, fontWeight: 600 }}>{card.example}</div><div style={{ fontSize: 12.5, color: C.sub }}>{card.exampleTranslation}</div>
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 14 }}><button onClick={() => setStatus("idle")} className="press" style={{ flex: 1, padding: 14, borderRadius: 16, border: "1.5px solid " + C.line, background: C.surface, color: C.ink, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>Try another</button><button onClick={confirm} className="press" style={{ flex: 2, padding: 14, borderRadius: 16, border: "none", background: C.green, color: "#fff", fontWeight: 800, cursor: "pointer", fontFamily: FONT, boxShadow: "0 6px 16px " + C.green + "55" }}>Add to my deck ✓</button></div>
          </div>
        )}
        <button onClick={onClose} className="press" style={{ width: "100%", marginTop: 14, padding: 12, borderRadius: 14, border: "none", background: "transparent", color: C.sub, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Close</button>
      </div>
    </div>
  );
}

/* ===================== SESSION COMPLETE ===================== */
const CHEERS = [(n) => "You smashed it, " + n + "! 💥", (n) => "On fire, " + n + "! 🔥", (n) => "Nailed it, " + n + "! 🎉", (n) => "Look at you go, " + n + "! ✨", (n) => "Unstoppable, " + n + "! ⚡"];
function SessionComplete({ points, reviews, dayStreak, name, onAgain, onDashboard }) {
  const pts = useCountUp(points);
  const line = useMemo(() => CHEERS[Math.floor(Math.random() * CHEERS.length)]((name || "friend")), [name]);
  useEffect(() => { playChime(); }, []);
  return (
    <div style={{ position: "relative", width: "100%", display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", padding: "10px 0" }}>
      <Confetti />
      <div className="pop" style={{ width: 96, height: 96, borderRadius: "50%", background: C.greenSoft, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 46, color: C.green, marginBottom: 16, boxShadow: "0 10px 30px " + C.green + "33" }}>✓</div>
      <h1 style={{ fontSize: 27, fontWeight: 800, color: C.ink, margin: "0 0 4px", letterSpacing: -0.6 }}>{line}</h1>
      <p style={{ color: C.sub, margin: "0 0 8px", fontSize: 15 }}>You earned</p>
      <div style={{ fontSize: 54, fontWeight: 800, color: C.amber, letterSpacing: -2, lineHeight: 1 }}>⭐ {pts}</div>
      <p style={{ color: C.sub, margin: "2px 0 22px", fontSize: 14, fontWeight: 600 }}>points this round</p>
      <div style={{ background: C.surface, borderRadius: 22, padding: "16px 26px", border: "1px solid " + C.line, display: "flex", gap: 26, boxShadow: "0 10px 30px rgba(28,26,46,0.08)" }}><Stat big={reviews} label="Reviews" color={C.fa} /><Divider /><Stat big={dayStreak} label="Day streak 🔥" color={C.primary} /></div>
      <div style={{ width: "100%", maxWidth: 320, marginTop: 26, display: "flex", flexDirection: "column", gap: 12 }}>
        <PrimaryButton onClick={onAgain}>Study again 🔁</PrimaryButton>
        <button onClick={onDashboard} className="press" style={{ padding: 14, borderRadius: 18, border: "1.5px solid " + C.line, background: C.surface, color: C.ink, fontSize: 15, fontWeight: 800, cursor: "pointer", fontFamily: FONT }}>Back to dashboard</button>
      </div>
    </div>
  );
}

/* ===================== PRIMITIVES ===================== */
function Shell({ children }) { return (<div style={{ minHeight: "100vh", width: "100%", display: "flex", justifyContent: "center", background: C.bg, fontFamily: FONT }}><div style={{ width: "100%", maxWidth: 440, position: "relative", display: "flex", flexDirection: "column", height: "100vh" }}>{children}</div></div>); }
function PrimaryButton({ children, onClick, disabled }) { return (<button onClick={onClick} disabled={disabled} className="press" style={{ width: "100%", padding: 16, borderRadius: 18, border: "none", cursor: disabled ? "not-allowed" : "pointer", background: disabled ? C.line : C.primary, color: disabled ? C.sub : "#fff", fontSize: 16.5, fontWeight: 800, fontFamily: FONT, letterSpacing: -0.2, boxShadow: disabled ? "none" : "0 8px 22px " + C.primary + "44", transition: "all .15s" }}>{children}</button>); }
function actionBtn(color) { return { width: 64, height: 64, borderRadius: "50%", border: "none", cursor: "pointer", background: color, color: "#fff", fontSize: 28, fontWeight: 900, boxShadow: "0 8px 20px " + color + "55", display: "flex", alignItems: "center", justifyContent: "center" }; }
function StyleTag() {
  return (<style>{`
    @keyframes confetti { 0% { transform: translateY(-20px) rotate(0); opacity:1 } 100% { transform: translateY(640px) rotate(540deg); opacity:.9 } }
    @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
    @keyframes sheet { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { 0%,100% { opacity:.4 } 50% { opacity:1 } }
    .pop { animation: pop .5s cubic-bezier(.2,.8,.2,1); }
    .sheet-in { animation: sheet .3s cubic-bezier(.2,.8,.2,1); }
    .shimmer-text { animation: shimmer 1.2s ease-in-out infinite; }
    .spinner { width:16px; height:16px; border:3px solid ` + C.line + `; border-top-color:` + C.primary + `; border-radius:50%; animation: spin .7s linear infinite; display:inline-block; vertical-align:middle; margin-right:6px; }
    .press { transition: transform .08s ease; }
    .press:active { transform: scale(0.95); }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    input::placeholder { color: #B6B2CE; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: ` + C.line + `; border-radius: 4px; }
  `}</style>);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
