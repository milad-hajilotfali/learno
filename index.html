    const prompt = "The learner studies " + langFull(language) + '. Build a flashcard for: "' + rawWord + '".\nReturn JSON with exactly these string fields:\n{"word": the headword in ' + targetFmt + ',\n"pron": a simple pronunciation guide,\n"translation": concise English meaning,\n"example": one short natural sentence in ' + (language === "fa" ? "Finglish" : "German") + ',\n"exampleTranslation": English translation,\n"note": part of speech' + (language === "de" ? " plus gender for nouns" : "") + ',\n"imageWord": 1-2 simple English keywords, comma-separated' + persianExtra + "}";

/* ===================== AUDIO ===================== */
let _voices = [];
const loadVoices = () => { try { _voices = window.speechSynthesis.getVoices() || []; } catch (_) {} };
if (typeof window !== "undefined" && "speechSynthesis" in window) { loadVoices(); try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch (_) {} }
const pickVoice = (prefix) => { if (!_voices.length) loadVoices(); return _voices.find((v) => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith(prefix)) || null; };
let _primed = false;
function primeTTS() { try { loadVoices(); if (_primed || !("speechSynthesis" in window)) return; _primed = true; const u = new SpeechSynthesisUtterance(" "); u.volume = 0; window.speechSynthesis.speak(u); } catch (_) {} }
if (typeof window !== "undefined") window.addEventListener("pointerdown", primeTTS, { once: true });
function speakSynth(text, langCode) { try { if (!("speechSynthesis" in window)) return; window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = langCode; const v = pickVoice(langCode.slice(0, 2).toLowerCase()); if (v) u.voice = v; u.rate = 0.85; window.speechSynthesis.speak(u); } catch (_) {} }
let _ttsAudio = null;
async function cloudTTS(text, langCode) {
  const res = await fetch("https://texttospeech.googleapis.com/v1/text:synthesize?key=" + TTS_KEY, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ input: { text: text }, voice: { languageCode: langCode }, audioConfig: { audioEncoding: "MP3" } }) });
  const d = await res.json();
  if (!d.audioContent) throw new Error("no audio");
  if (_ttsAudio) { try { _ttsAudio.pause(); } catch (_) {} }
  _ttsAudio = new Audio("data:audio/mp3;base64," + d.audioContent);
  await _ttsAudio.play();
}
function speakNetwork(text, tl) { return new Promise((resolve, reject) => { try { if (_ttsAudio) { try { _ttsAudio.pause(); } catch (_) {} } const url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=" + tl + "&q=" + encodeURIComponent(text); _ttsAudio = new Audio(url); _ttsAudio.onerror = () => reject(); const p = _ttsAudio.play(); if (p && p.then) p.then(() => resolve()).catch(() => reject()); else resolve(); } catch (_) { reject(); } }); }
function speak(text, langCode) {
  primeTTS();
  const prefix = (langCode || "").slice(0, 2).toLowerCase();
  const tl = prefix === "fa" ? "fa" : "de";
  const deviceOrNet = () => { const v = pickVoice(prefix); if (v) speakSynth(text, langCode); else speakNetwork(text, tl).catch(() => speakSynth(text, langCode)); };
  if (TTS_KEY) { cloudTTS(text, langCode).catch(deviceOrNet); return; }
  deviceOrNet();
}

function playChime() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
    const ctx = new Ctx(); if (ctx.state === "suspended") ctx.resume();
    const now = ctx.currentTime; const master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
    const seq = [392.0, 523.25, 659.25, 783.99];
    seq.forEach((f, i) => { const t = now + i * 0.12; const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f; const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = f * 2; const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.65); const g2 = ctx.createGain(); g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(0.12, t + 0.02); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.5); o.connect(g); g.connect(master); o2.connect(g2); g2.connect(master); o.start(t); o.stop(t + 0.7); o2.start(t); o2.stop(t + 0.55); });
    setTimeout(() => { try { ctx.close(); } catch (_) {} }, 1600);
  } catch (_) {}
}

/* ===================== HISTORY (12 weeks of daily data) ===================== */
const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function buildHistory() {
  const TOTAL = 84; const now = new Date(); const out = [];
  for (let i = TOTAL - 1; i >= 0; i--) {
    const d = new Date(now); d.setDate(now.getDate() - i);
    const seed = d.getFullYear() * 372 + (d.getMonth() + 1) * 31 + d.getDate();
    const r = Math.abs(Math.sin(seed));
    let pts;
    if (i === 0) pts = 0;                          // today starts empty
    else if (i <= 10) pts = Math.round(8 + r * 14); // recent active streak
    else pts = r > 0.32 ? Math.round(5 + r * 16) : 0;
    out.push({ date: d.toISOString().slice(0, 10), label: DAY_NAMES[d.getDay()], dm: MONTHS[d.getMonth()] + " " + d.getDate(), points: pts });
  }
  return out;
}
function calcStreak(h) { let i = h.length - 1; if (h[i].points === 0) i--; let s = 0; for (; i >= 0; i--) { if (h[i].points > 0) s++; else break; } return s; }

/* ===================== SMALL UI ===================== */
function Icon({ name, size = 18, color, style }) { return <i className={"fa-solid fa-" + name} style={{ fontSize: size, color: color, lineHeight: 1, ...style }} aria-hidden="true"></i>; }
function useCountUp(target, duration) { duration = duration || 700; const [val, setVal] = useState(0); useEffect(() => { let raf; const start = performance.now(); const tick = (now) => { const p = Math.min(1, (now - start) / duration); setVal(Math.round(target * easeOut(p))); if (p < 1) raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick); return () => cancelAnimationFrame(raf); }, [target, duration]); return val; }

function Avatar({ seed, size = 44, ring }) {
  const [err, setErr] = useState(false);
  return (<div style={{ width: size, height: size, borderRadius: "50%", overflow: "hidden", background: C.primarySoft, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: ring ? ("0 0 0 3px " + ring) : "none" }}>{!err ? <img src={avatarURL(seed)} onError={() => setErr(true)} alt="" style={{ width: "100%", height: "100%" }} /> : <Icon name="user" size={size * 0.5} color={C.primary} />}</div>);
}

function Confetti() {
  const pieces = useMemo(() => { const colors = [C.primary, C.green, C.fa, C.de, C.amber, "#A06BFF"]; return Array.from({ length: 70 }, (_, i) => ({ id: i, left: Math.random() * 100, delay: Math.random() * 0.4, dur: 2.0 + Math.random() * 1.4, size: 7 + Math.random() * 8, color: colors[i % colors.length], rot: Math.random() * 360, round: Math.random() > 0.5 })); }, []);
  return (<div style={{ position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none", zIndex: 50 }}>{pieces.map((p) => (<div key={p.id} style={{ position: "absolute", top: "-20px", left: p.left + "%", width: p.size, height: p.size, background: p.color, borderRadius: p.round ? "50%" : "2px", transform: "rotate(" + p.rot + "deg)", animation: "confetti " + p.dur + "s " + p.delay + "s linear forwards" }} />))}</div>);
}

function Ring({ pct, color, size = 84, stroke = 9, label, value }) {
  const r = (size - stroke) / 2, circ = 2 * Math.PI * r, off = circ * (1 - pct);
  return (<div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}><div style={{ position: "relative", width: size, height: size }}><svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}><circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.line} strokeWidth={stroke} /><circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={off} style={{ transition: "stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)" }} /></svg><div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, color: C.ink, fontSize: 15 }}>{value}</div></div><span style={{ fontSize: 13, color: C.sub, fontWeight: 600 }}>{label}</span></div>);
}

function SpeakBtn({ text, lang, color, size = 38 }) {
  const stop = (e) => e.stopPropagation();
  return (<button onPointerDown={stop} onClick={(e) => { stop(e); speak(text, lang); }} className="press" aria-label="Play pronunciation" style={{ width: size, height: size, borderRadius: "50%", border: "none", cursor: "pointer", background: color + "1A", color: color, display: "inline-flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><Icon name="volume-high" size={size * 0.42} color={color} /></button>);
}

function WordImage({ card, soft, width = "100%", height = 116 }) {
  const [loaded, setLoaded] = useState(false); const [err, setErr] = useState(false);
  return (<div style={{ width: width, height: height, borderRadius: 18, overflow: "hidden", background: soft, position: "relative", flexShrink: 0 }}>{!err && <img src={imgURL(card)} alt={card.translation} referrerPolicy="no-referrer" onLoad={() => setLoaded(true)} onError={() => setErr(true)} style={{ width: "100%", height: "100%", objectFit: "cover", opacity: loaded ? 1 : 0, transition: "opacity .4s" }} />}{(!loaded || err) && <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: C.sub, fontSize: 12.5, fontWeight: 700, gap: 6, flexDirection: "column" }}><Icon name="image" size={20} color={C.sub} />{err ? card.translation : "loading…"}</div>}</div>);
}

const sayWordOf = (card) => (card.language === "fa" ? (card.farsi || card.word) : card.word);
const sayExampleOf = (card) => (card.language === "fa" ? (card.farsiExample || card.example) : card.example);

/* ===================== APP ===================== */
function App() {
  const [screen, setScreen] = useState("signin");   // login FIRST
  const [tab, setTab] = useState("dashboard");
  const [selectedLangs, setSelectedLangs] = useState([]); // single language, kept as 1-item array
  const [user, setUser] = useState(null);
  const [allCards, setAllCards] = useState([]);
  const [learnedIds, setLearnedIds] = useState([]);
  const [queue, setQueue] = useState([]);
  const [reviewCount, setReviewCount] = useState(0);
  const [roundPoints, setRoundPoints] = useState(0);
  const [history, setHistory] = useState(() => buildHistory());
  const dayStreak = useMemo(() => calcStreak(history), [history]);
  const totalPoints = useMemo(() => history.reduce((a, d) => a + d.points, 0), [history]);
  const committed = useRef(false);
  const remaining = useMemo(() => allCards.filter((c) => !learnedIds.includes(c.id)), [allCards, learnedIds]);
  const initData = async (langs) => { const words = await dataService.fetchWords(langs); setAllCards(words); setLearnedIds([]); setQueue([]); };

  const startSession = (review) => { const pool = review || remaining.length === 0 ? allCards : remaining; setQueue(shuffle(pool)); setReviewCount(0); setRoundPoints(0); committed.current = false; setFlipped(false); setDragX(0); setExitDir(null); setScreen("deck"); };
  const commitRound = (pts) => { if (pts <= 0) return; setHistory((h) => { const c = [...h]; c[c.length - 1] = { ...c[c.length - 1], points: c[c.length - 1].points + pts }; return c; }); };
  useEffect(() => { if (screen === "deck" && allCards.length > 0 && queue.length === 0 && !committed.current) { committed.current = true; commitRound(roundPoints); } }, [screen, queue.length, roundPoints, allCards.length]);
  const exitToApp = () => { if (!committed.current && roundPoints > 0) { committed.current = true; commitRound(roundPoints); } setTab("dashboard"); setScreen("app"); };
  const signOut = () => { setUser(null); setSelectedLangs([]); setAllCards([]); setLearnedIds([]); setQueue([]); setHistory(buildHistory()); setTab("dashboard"); setScreen("signin"); };

  const [flipped, setFlipped] = useState(false);
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const [exitDir, setExitDir] = useState(null);
  const startX = useRef(0); const startY = useRef(0); const moved = useRef(false); const active = useRef(false); const locked = useRef(false);

  const commitSwipe = (dir) => {
    setQueue((q) => { if (!q.length) return q; const top = q[0], rest = q.slice(1); if (dir === "right") { setLearnedIds((ids) => (ids.includes(top.id) ? ids : [...ids, top.id])); setRoundPoints((p) => p + 1); dataService.saveProgress({ userId: user && user.id, cardId: top.id, status: "known" }); return rest; } setReviewCount((c) => c + 1); dataService.saveProgress({ userId: user && user.id, cardId: top.id, status: "review" }); return [...rest, top]; });
    setFlipped(false); setDragX(0); setExitDir(null); locked.current = false;
  };
  const triggerSwipe = (dir) => { if (locked.current || queue.length === 0) return; locked.current = true; setExitDir(dir); setDragging(false); setTimeout(() => commitSwipe(dir), 320); };
  const onPointerDown = (e) => { if (exitDir) return; active.current = true; moved.current = false; startX.current = e.clientX; startY.current = e.clientY; setDragging(true); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} };
  const onPointerMove = (e) => { if (!active.current || exitDir) return; const dx = e.clientX - startX.current, dy = e.clientY - startY.current; if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved.current = true; setDragX(dx); };
  const onPointerUp = () => { if (!active.current) return; active.current = false; setDragging(false); if (!moved.current) { setFlipped((f) => !f); setDragX(0); return; } if (dragX > 110) triggerSwipe("right"); else if (dragX < -110) triggerSwipe("left"); else setDragX(0); };

  const addCard = (card) => { setAllCards((prev) => [...prev, card]); };
  const deleteCard = (id) => { setAllCards((p) => p.filter((c) => c.id !== id)); setQueue((q) => q.filter((c) => c.id !== id)); setLearnedIds((ids) => ids.filter((x) => x !== id)); };

  // 1) LOGIN first
  if (screen === "signin") return <SignIn onDone={(u) => { setUser(u); setScreen("onboarding"); }} />;

  // 2) Then choose ONE language
  if (screen === "onboarding") {
    const choose = (l) => setSelectedLangs([l]); // single select
    const cont = async () => { await initData(selectedLangs); setTab("dashboard"); setScreen("app"); };
    return (
      <Shell><StyleTag />
        <div style={{ padding: "52px 24px 28px", display: "flex", flexDirection: "column", flex: 1, overflowY: "auto" }}>
          <div style={{ fontSize: 40 }}>👋</div>
          <h1 style={{ fontSize: 30, fontWeight: 800, color: C.ink, margin: "16px 0 6px", letterSpacing: -0.8, lineHeight: 1.15 }}>What do you<br />want to learn?</h1>
          <p style={{ color: C.sub, margin: 0, fontSize: 15.5 }}>Pick one language to start. You can switch anytime.</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 14, marginTop: 28 }}>
            {["fa", "de"].map((l) => { const m = langMeta[l]; const on = selectedLangs[0] === l; return (
              <button key={l} onClick={() => choose(l)} className="press" style={{ display: "flex", alignItems: "center", gap: 16, padding: "18px 18px", borderRadius: 20, cursor: "pointer", textAlign: "left", background: C.surface, border: on ? "2px solid " + m.color : "2px solid " + C.line, boxShadow: on ? "0 10px 24px " + m.color + "33" : "0 2px 10px rgba(20,20,50,0.04)", transition: "all .2s cubic-bezier(.2,.8,.2,1)", fontFamily: FONT }}>
                <div style={{ width: 52, height: 52, borderRadius: 16, background: m.soft, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, flexShrink: 0 }}>{m.flag}</div>
                <div style={{ flex: 1 }}><div style={{ fontSize: 18, fontWeight: 800, color: C.ink }}>{m.label}</div><div style={{ fontSize: 13.5, color: C.sub, fontWeight: 500 }}>{m.sub} · 15 starter words</div></div>
                <div style={{ width: 26, height: 26, borderRadius: "50%", border: on ? "none" : "2px solid " + C.line, background: on ? m.color : "transparent", display: "flex", alignItems: "center", justifyContent: "center" }}>{on && <Icon name="check" size={13} color="#fff" />}</div>
              </button>); })}
          </div>
          <div style={{ flex: 1, minHeight: 24 }} />
          <PrimaryButton disabled={!selectedLangs.length} onClick={cont}>Continue</PrimaryButton>
        </div>
      </Shell>
    );
  }

  if (screen === "deck") {
    const current = queue[0]; const sessionDone = queue.length === 0; const totalChosen = allCards.length;
    const knowHint = Math.max(0, Math.min(1, dragX / 110)); const reviewHint = Math.max(0, Math.min(1, -dragX / 110));
    const topTransform = exitDir ? ("translateX(" + (exitDir === "right" ? 640 : -640) + "px) rotate(" + (exitDir === "right" ? 26 : -26) + "deg)") : ("translateX(" + dragX + "px) rotate(" + (dragX / 22) + "deg)");
    const topTransition = dragging ? "none" : "transform .34s cubic-bezier(.2,.8,.2,1)";
    const tint = exitDir === "right" ? { c: C.green, o: 0.92, t: "KNOW" } : exitDir === "left" ? { c: C.red, o: 0.92, t: "REVIEW" } : dragX > 0 ? { c: C.green, o: knowHint * 0.85, t: "KNOW" } : dragX < 0 ? { c: C.red, o: reviewHint * 0.85, t: "REVIEW" } : { c: C.green, o: 0, t: "" };
    return (
      <Shell><StyleTag />
        <div style={{ padding: "18px 18px 4px", display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={exitToApp} className="press" aria-label="Exit" style={{ background: C.surface, border: "1.5px solid " + C.line, borderRadius: 14, width: 44, height: 44, cursor: "pointer", color: C.ink }}><Icon name="xmark" size={18} color={C.ink} /></button>
          <div style={{ flex: 1 }}>
            <div style={{ height: 10, background: C.line, borderRadius: 8, overflow: "hidden" }}><div style={{ width: (totalChosen ? (learnedIds.length / totalChosen) * 100 : 0) + "%", height: "100%", background: C.primary, borderRadius: 8, transition: "width .4s cubic-bezier(.2,.8,.2,1)" }} /></div>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.sub, marginTop: 5 }}>{queue.length} left this round</div>
          </div>
          <div style={{ background: C.amber + "1A", border: "1.5px solid " + C.amber + "44", borderRadius: 14, padding: "8px 12px", fontWeight: 800, fontSize: 15, color: C.amber, display: "flex", alignItems: "center", gap: 5 }}><Icon name="star" size={13} color={C.amber} /> {roundPoints}</div>
        </div>
        <div style={{ flex: 1, position: "relative", display: "flex", alignItems: "center", justifyContent: "center", padding: "8px 20px 0", minHeight: 0 }}>
          {sessionDone ? (<SessionComplete points={roundPoints} reviews={reviewCount} dayStreak={dayStreak} name={user && user.name} onDashboard={exitToApp} />) : (
            <div style={{ position: "relative", width: "100%", maxWidth: 360, height: 470, margin: "0 auto" }}>
              {queue.slice(1, 3).map((card, i) => { const d = i + 1; return (<div key={card.id} style={{ position: "absolute", inset: 0, transform: "translateY(" + (d * 13) + "px) scale(" + (1 - d * 0.045) + ")", zIndex: 1 }}><div style={{ ...cardBase, border: "1px solid " + C.line }} /></div>); })}
              {current && (
                <div key={current.id} onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp} style={{ position: "absolute", inset: 0, zIndex: 5, transform: topTransform, transition: topTransition, touchAction: "none", cursor: "grab" }}>
                  <div style={{ position: "relative", width: "100%", height: "100%" }}>
                    <div style={{ position: "absolute", inset: 0, perspective: 1300 }}><div style={{ position: "relative", width: "100%", height: "100%", transformStyle: "preserve-3d", transform: "rotateY(" + (flipped ? 180 : 0) + "deg)", transition: "transform .55s cubic-bezier(.4,.15,.2,1)" }}><CardFront card={current} /><CardBack card={current} /></div></div>
                    <div style={{ position: "absolute", inset: 0, borderRadius: 28, background: tint.c, opacity: tint.o, display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none", transition: dragging ? "none" : "opacity .22s ease", zIndex: 6 }}>{tint.t && <span style={{ color: "#fff", fontWeight: 900, fontSize: 38, letterSpacing: 3, transform: "scale(" + (0.8 + tint.o * 0.3) + ")", textShadow: "0 2px 8px rgba(0,0,0,0.15)" }}>{tint.t}</span>}</div>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
        {!sessionDone && (<div style={{ padding: "10px 24px", paddingBottom: "calc(24px + env(safe-area-inset-bottom))", display: "flex", alignItems: "center", justifyContent: "center", gap: 28 }}><button onClick={() => triggerSwipe("left")} className="press" style={actionBtn(C.red)} aria-label="Review"><Icon name="xmark" size={26} color="#fff" /></button><button onClick={() => setFlipped((f) => !f)} className="press" style={{ background: "transparent", border: "none", color: C.sub, fontSize: 12.5, fontWeight: 700, cursor: "pointer", letterSpacing: 0.5, display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}><Icon name="arrows-rotate" size={16} color={C.sub} />FLIP</button><button onClick={() => triggerSwipe("right")} className="press" style={actionBtn(C.green)} aria-label="I know this"><Icon name="check" size={26} color="#fff" /></button></div>)}
      </Shell>
    );
  }

  return (
    <Shell><StyleTag />
      <div style={{ flex: 1, overflowY: "auto", WebkitOverflowScrolling: "touch", minHeight: 0 }}>
        {tab === "dashboard" && <Dashboard user={user} allCards={allCards} learnedIds={learnedIds} remaining={remaining} dayStreak={dayStreak} history={history} totalPoints={totalPoints} onStart={() => startSession(false)} onOpenProfile={() => setTab("profile")} />}
        {tab === "mywords" && <MyWordsPage allCards={allCards} learnedIds={learnedIds} selectedLangs={selectedLangs} onAdd={addCard} onDelete={deleteCard} />}
        {tab === "friends" && <FriendsPage />}
        {tab === "profile" && <ProfilePage user={user} setUser={setUser} selectedLangs={selectedLangs} setSelectedLangs={setSelectedLangs} onLangsChanged={async (langs) => { await initData(langs); }} onSignOut={signOut} />}
      </div>
      <TabBar tab={tab} setTab={setTab} />
    </Shell>
  );
}

/* ===================== TAB BAR ===================== */
function TabBar({ tab, setTab }) {
  const items = [{ k: "dashboard", icon: "house", label: "Home" }, { k: "mywords", icon: "layer-group", label: "My Words" }, { k: "friends", icon: "user-group", label: "Friends" }, { k: "profile", icon: "user", label: "Profile" }];
  return (
    <div style={{ display: "flex", borderTop: "1px solid " + C.line, background: C.surface, paddingTop: 8, paddingLeft: 6, paddingRight: 6, paddingBottom: "calc(14px + env(safe-area-inset-bottom))" }}>
      {items.map((it) => { const on = tab === it.k; return (<button key={it.k} onClick={() => setTab(it.k)} className="press" style={{ flex: 1, background: "transparent", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, padding: "6px 0", fontFamily: FONT }}><Icon name={it.icon} size={19} color={on ? C.primary : "#B6B2CE"} /><span style={{ fontSize: 11, fontWeight: 800, color: on ? C.primary : C.sub }}>{it.label}</span></button>); })}
    </div>
  );
}

      <div style={{ height: 4, width: 44, borderRadius: 4, background: m.color, opacity: 0.85, alignSelf: "center" }} />

        {card.pron && <div style={{ fontSize: 16, color: C.sub, fontWeight: 600, letterSpacing: 0.5, fontFamily: "'SFMono-Regular', ui-monospace, monospace" }}>/ {card.pron} /</div>}
        <div style={{ marginTop: 4, display: "flex", alignItems: "center", gap: 8, background: m.soft, padding: "8px 14px 8px 10px", borderRadius: 30 }}><SpeakBtn text={sayWordOf(card)} lang={m.ttsLang} color={m.color} size={34} /><span style={{ fontSize: 14, fontWeight: 700, color: m.color }}>Hear it</span></div>
      </div>
      <div style={{ textAlign: "center", fontSize: 12.5, color: C.sub, fontWeight: 600 }}>tap card to flip</div>
    </div>
  );
}
function CardBack({ card }) {
  const m = langMeta[card.language];
  return (
    <div style={{ ...cardBase, transform: "rotateY(180deg)", display: "flex", flexDirection: "column", padding: 22, justifyContent: "space-between", background: "#FBFAFF" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}><div style={{ flex: 1, fontSize: 18, fontWeight: 800, color: C.ink }}>{card.word}</div><SpeakBtn text={sayWordOf(card)} lang={m.ttsLang} color={m.color} size={34} /></div>
      <div style={{ display: "flex", justifyContent: "center" }}><WordImage card={card} soft={m.soft} width={172} height={172} /></div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <div><div style={{ fontSize: 11, color: m.color, fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.6 }}>Meaning</div><div style={{ fontSize: 25, fontWeight: 800, color: C.ink, letterSpacing: -0.5, lineHeight: 1.1 }}>{card.translation}</div></div>
        <div style={{ background: C.surface, borderRadius: 16, padding: "12px 14px", border: "1px solid " + C.line, display: "flex", alignItems: "flex-start", gap: 10 }}><div style={{ flex: 1 }}><div style={{ fontSize: 15.5, fontWeight: 700, color: C.ink }}>{card.example}</div><div style={{ fontSize: 13, color: C.sub, fontWeight: 500, marginTop: 2 }}>{card.exampleTranslation}</div></div><SpeakBtn text={sayExampleOf(card)} lang={m.ttsLang} color={m.color} size={32} /></div>
        {card.note && <div style={{ fontSize: 12.5, color: C.sub, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}><Icon name="circle-info" size={12} color={C.sub} />{card.note}</div>}
      </div>
    </div>
  );
}

/* ===================== SIGN IN ===================== */
function SignIn({ onDone }) {
  const [name, setName] = useState(""); const [email, setEmail] = useState(""); const [loading, setLoading] = useState(false);
  const [avatar, setAvatar] = useState(AVATARS[Math.floor(Math.random() * AVATARS.length)]);
  const goEmail = async () => { if (!email.includes("@") || loading) return; setLoading(true); const u = await dataService.signInWithEmail(email, name); onDone({ ...u, avatar }); };
  const goGoogle = async () => { if (loading) return; setLoading(true); const u = await dataService.signInWithGoogle(name); onDone({ ...u, avatar }); };
  return (
    <Shell><StyleTag />
      <div style={{ padding: "40px 24px", display: "flex", flexDirection: "column", flex: 1, overflowY: "auto" }}>
        <h1 style={{ fontSize: 26, fontWeight: 800, color: C.ink, textAlign: "center", margin: "0 0 4px", letterSpacing: -0.6 }}>Let's get started</h1>
        <p style={{ color: C.sub, textAlign: "center", margin: 0 }}>Pick a character and tell us your name.</p>
        <div style={{ display: "flex", justifyContent: "center", margin: "18px 0 6px" }}><Avatar seed={avatar} size={92} ring={C.primary} /></div>
        <div style={{ display: "flex", gap: 10, overflowX: "auto", padding: "10px 2px 4px" }}>{AVATARS.map((a) => (<button key={a} onClick={() => setAvatar(a)} className="press" style={{ border: "none", background: "transparent", cursor: "pointer", padding: 2, borderRadius: "50%", flexShrink: 0 }}><Avatar seed={a} size={52} ring={avatar === a ? C.primary : null} /></button>))}</div>
        <div style={{ background: C.surface, borderRadius: 24, padding: 22, marginTop: 18, border: "1px solid " + C.line, boxShadow: "0 8px 28px rgba(28,26,46,0.06)" }}>
          <label style={{ fontSize: 13, fontWeight: 700, color: C.sub }}>Your name</label>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Milad" disabled={loading} style={inputStyle} />
          <label style={{ fontSize: 13, fontWeight: 700, color: C.sub, display: "block", marginTop: 14 }}>Email</label>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" disabled={loading} onKeyDown={(e) => e.key === "Enter" && goEmail()} style={inputStyle} />
          <div style={{ marginTop: 14 }}><PrimaryButton disabled={loading} onClick={goEmail}>{loading ? "Signing in…" : "Continue with Email"}</PrimaryButton></div>
          <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "16px 0" }}><div style={{ flex: 1, height: 1, background: C.line }} /><span style={{ fontSize: 12, color: C.sub, fontWeight: 700 }}>OR</span><div style={{ flex: 1, height: 1, background: C.line }} /></div>
          <button onClick={goGoogle} disabled={loading} className="press" style={{ width: "100%", padding: 13, borderRadius: 14, border: "1.5px solid " + C.line, background: C.surface, color: C.ink, fontWeight: 700, fontSize: 15, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 10, fontFamily: FONT }}><i className="fa-brands fa-google" style={{ color: "#4285F4", fontSize: 16 }}></i> Continue with Google</button>
        </div>
      </div>
    </Shell>
  );
}
const inputStyle = { width: "100%", marginTop: 6, padding: "13px 15px", fontSize: 15, borderRadius: 14, border: "1.5px solid " + C.line, outline: "none", fontFamily: FONT, color: C.ink, boxSizing: "border-box" };

/* ===================== AVATAR PICKER ===================== */
function AvatarPicker({ current, onPick, onClose }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(20,18,40,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 100 }}>
      <div onClick={(e) => e.stopPropagation()} className="sheet-in" style={{ width: "100%", maxWidth: 440, background: C.surface, borderRadius: "26px 26px 0 0", padding: 22, paddingBottom: "calc(22px + env(safe-area-inset-bottom))", fontFamily: FONT, maxHeight: "78vh", overflowY: "auto" }}>

function PointsChart({ history }) {
  const [mode, setMode] = useState("week");
  const [offset, setOffset] = useState(0);
  const [grow, setGrow] = useState(false);
  useEffect(() => { setOffset(0); }, [mode]);
  useEffect(() => { setGrow(false); const t = setTimeout(() => setGrow(true), 40); return () => clearTimeout(t); }, [mode, offset]);

  const total = history.length;
  const todayIdx = total - 1;
  const weeksAvail = Math.ceil(total / 7);

  let bars = [], rangeLabel = "", periodTotal = 0, canPrev = false, canNext = false;

  if (mode === "week") {
    const end = total + offset * 7, start = end - 7;
    for (let idx = start; idx < end; idx++) {
      if (idx < 0 || idx >= total) { bars.push({ label: "", points: 0, ghost: true }); continue; }
      const d = history[idx];
      bars.push({ label: d.label, points: d.points, today: idx === todayIdx });
      periodTotal += d.points;
    }
    rangeLabel = offset === 0 ? "This week" : history[Math.max(0, start)].dm + " – " + history[Math.min(total - 1, end - 1)].dm;
    canNext = offset < 0; canPrev = -offset < weeksAvail - 1;
  } else {
    const buckets = [];
    for (let e = total; e > 0; e -= 7) { const s = Math.max(0, e - 7); const slice = history.slice(s, e); buckets.push({ dm: history[s].dm, points: slice.reduce((a, x) => a + x.points, 0), current: e === total }); }
    const pages = Math.ceil(buckets.length / 4);
    const pageStart = (-offset) * 4;
    const page = buckets.slice(pageStart, pageStart + 4).reverse();
    page.forEach((b) => { bars.push({ label: b.dm, points: b.points, today: b.current }); periodTotal += b.points; });
    rangeLabel = offset === 0 ? "Last 4 weeks" : (page.length ? page[0].dm + " – " + page[page.length - 1].dm : "");
    canNext = offset < 0; canPrev = -offset < pages - 1;
  }
  const max = Math.max(10, ...bars.map((b) => b.points));
  const navBtn = (dir, enabled, onClick) => (<button onClick={enabled ? onClick : undefined} disabled={!enabled} className="press" style={{ width: 34, height: 34, borderRadius: 11, border: "1.5px solid " + C.line, background: C.surface, color: enabled ? C.ink : "#D8D5E8", cursor: enabled ? "pointer" : "default" }}><Icon name={dir === "prev" ? "chevron-left" : "chevron-right"} size={13} color={enabled ? C.ink : "#D8D5E8"} /></button>);

  return (
    <div style={{ background: C.surface, borderRadius: 22, padding: "18px 18px 14px", border: "1px solid " + C.line, boxShadow: "0 8px 24px rgba(28,26,46,0.05)" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, gap: 10 }}>
        <div style={{ display: "flex", background: C.bg, borderRadius: 12, padding: 3 }}>{["week", "month"].map((k) => { const on = mode === k; return (<button key={k} onClick={() => setMode(k)} className="press" style={{ padding: "7px 14px", borderRadius: 10, border: "none", cursor: "pointer", background: on ? C.surface : "transparent", color: on ? C.primary : C.sub, fontWeight: 800, fontSize: 13, fontFamily: FONT, boxShadow: on ? "0 2px 6px rgba(28,26,46,0.08)" : "none", textTransform: "capitalize" }}>{k}</button>); })}</div>
        <span style={{ fontSize: 14, fontWeight: 800, color: C.amber, display: "flex", alignItems: "center", gap: 5 }}><Icon name="star" size={13} color={C.amber} /> {periodTotal} pts</span>
      </div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        {navBtn("prev", canPrev, () => setOffset((o) => o - 1))}
        <span style={{ fontSize: 13.5, fontWeight: 800, color: C.ink }}>{rangeLabel}</span>
        {navBtn("next", canNext, () => setOffset((o) => o + 1))}
      </div>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 8, height: 104 }}>{bars.map((d, i) => { const h = grow ? Math.max(d.points > 0 ? 8 : 3, (d.points / max) * 84) : 3; return (<div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6, height: "100%", justifyContent: "flex-end" }}><span style={{ fontSize: 10.5, fontWeight: 700, color: d.points ? C.ink : "transparent" }}>{d.points || 0}</span><div style={{ width: "100%", maxWidth: 28, height: h, borderRadius: 8, background: d.ghost ? C.line : (d.today ? "linear-gradient(180deg,#6A5BFF,#A06BFF)" : C.primarySoft), transition: "height .8s cubic-bezier(.2,.8,.2,1)", boxShadow: d.today ? "0 4px 12px " + C.primary + "55" : "none", opacity: d.ghost ? 0.5 : 1 }} /><span style={{ fontSize: mode === "month" ? 9.5 : 11, fontWeight: 700, color: d.today ? C.primary : C.sub, whiteSpace: "nowrap" }}>{d.label}</span></div>); })}</div>
    </div>
  );
}

function AddWordModal({ selectedLangs, onClose, onAdd }) {
  const [lang, setLang] = useState(selectedLangs[0] || "fa");

      const c = await dataService.generateCard(f.word.trim(), lang);
      setF({ word: c.word || f.word, translation: c.translation || "", pron: c.pron || "", example: c.example || "", exampleTranslation: c.exampleTranslation || "", farsi: c.farsi || "", farsiExample: c.farsiExample || "" });

  const canAdd = f.word.trim() && f.translation.trim();
  const add = () => { if (!canAdd) return; onAdd({ id: "u" + Date.now(), language: lang, word: f.word.trim(), translation: f.translation.trim(), pron: f.pron.trim(), example: f.example.trim(), exampleTranslation: f.exampleTranslation.trim(), note: "added by you", imageWord: f.translation.trim(), farsi: f.farsi.trim(), farsiExample: f.farsiExample.trim(), custom: true }); onClose(); };
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(20,18,40,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 100 }}>
      <div onClick={(e) => e.stopPropagation()} className="sheet-in" style={{ width: "100%", maxWidth: 440, background: C.surface, borderRadius: "26px 26px 0 0", padding: 22, paddingBottom: "calc(22px + env(safe-area-inset-bottom))", maxHeight: "90vh", overflowY: "auto", fontFamily: FONT }}>
        <div style={{ width: 40, height: 5, background: C.line, borderRadius: 4, margin: "0 auto 16px" }} />
        <h2 style={{ fontSize: 20, fontWeight: 800, color: C.ink, margin: "0 0 4px", letterSpacing: -0.4 }}>Add a word</h2>
        <p style={{ color: C.sub, fontSize: 14, margin: "0 0 14px" }}>Type the word, tap auto-fill, or just fill it in yourself.</p>
        {selectedLangs.length > 1 && (<div style={{ display: "flex", gap: 10, marginBottom: 6 }}>{selectedLangs.map((l) => { const lm = langMeta[l]; const on = lang === l; return <button key={l} onClick={() => setLang(l)} className="press" style={{ flex: 1, padding: "10px", borderRadius: 12, border: on ? "2px solid " + lm.color : "2px solid " + C.line, background: on ? lm.soft : C.surface, fontWeight: 700, color: C.ink, cursor: "pointer", fontFamily: FONT }}>{lm.flag} {lm.label}</button>; })}</div>)}
        <Field label={"Word (" + langMeta[lang].label + (lang === "fa" ? ", Finglish" : "") + ")"} value={f.word} onChange={set("word")} placeholder={lang === "fa" ? "e.g. mehraboon" : "e.g. der Apfel"} />
        <button onClick={autofill} disabled={!f.word.trim() || auto === "loading"} className="press" style={{ width: "100%", marginTop: 10, padding: 11, borderRadius: 12, border: "1.5px solid " + C.primary + "55", background: C.primarySoft, color: C.primary, fontWeight: 800, fontSize: 14, cursor: f.word.trim() ? "pointer" : "default", fontFamily: FONT, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>{auto === "loading" ? <><span className="spinner" /> Auto-filling…</> : <><Icon name="wand-magic-sparkles" size={14} color={C.primary} /> Auto-fill card</>}</button>
        {auto === "done" && <div style={{ fontSize: 12.5, color: C.green, marginTop: 8, fontWeight: 600 }}>Filled in meaning, pronunciation & example — edit anything you like.</div>}
        {auto === "partial" && <div style={{ fontSize: 12.5, color: C.green, marginTop: 8, fontWeight: 600 }}>Added the translation — add an example/pronunciation if you like.</div>}
        {auto === "error" && <div style={{ fontSize: 12.5, color: C.sub, marginTop: 8 }}>Couldn't auto-fill right now — just fill in the fields below.</div>}
        <Field label="Translation (English)" value={f.translation} onChange={set("translation")} placeholder="e.g. the apple" />
        <Field label="Pronunciation (optional)" value={f.pron} onChange={set("pron")} placeholder="e.g. dair AP-fel" />
        <Field label="Example sentence (optional)" value={f.example} onChange={set("example")} placeholder="a short sentence" />
        <Field label="Example in English (optional)" value={f.exampleTranslation} onChange={set("exampleTranslation")} placeholder="its translation" />
        {lang === "fa" && <Field label="Farsi script (optional · used for audio)" value={f.farsi} onChange={set("farsi")} placeholder="e.g. مهربون" dir="rtl" />}
        <button onClick={add} disabled={!canAdd} className="press" style={{ width: "100%", marginTop: 18, padding: 15, borderRadius: 16, border: "none", background: canAdd ? C.green : C.line, color: canAdd ? "#fff" : C.sub, fontWeight: 800, fontSize: 15.5, cursor: canAdd ? "pointer" : "default", fontFamily: FONT, boxShadow: canAdd ? "0 6px 16px " + C.green + "55" : "none" }}>Add to my words</button>
        <button onClick={onClose} className="press" style={{ width: "100%", marginTop: 10, padding: 12, borderRadius: 14, border: "none", background: "transparent", color: C.sub, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Cancel</button>
      </div>
    </div>
  );
}

/* ===================== SESSION COMPLETE ===================== */
const CHEERS = [(n) => "You smashed it, " + n + "! 💥", (n) => "On fire, " + n + "! 🔥", (n) => "Nailed it, " + n + "! 🎉", (n) => "Look at you go, " + n + "! ✨", (n) => "Unstoppable, " + n + "! ⚡"];
function SessionComplete({ points, reviews, dayStreak, name, onDashboard }) {
  const pts = useCountUp(points);
  const line = useMemo(() => CHEERS[Math.floor(Math.random() * CHEERS.length)]((name || "friend")), [name]);
  const [shared, setShared] = useState("");
  useEffect(() => { playChime(); }, []);
  const onShare = async () => {
    const txt = shareText(points, dayStreak, name);
    try { if (navigator.share) { await navigator.share({ text: txt }); return; } } catch (_) {}
    try { await navigator.clipboard.writeText(txt); setShared("Copied to clipboard!"); setTimeout(() => setShared(""), 2000); return; } catch (_) {}
    setShared("Share not available here"); setTimeout(() => setShared(""), 2000);
  };
  return (
    <div style={{ position: "relative", width: "100%", display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", padding: "10px 0" }}>
      <Confetti />
      <div className="pop" style={{ width: 96, height: 96, borderRadius: "50%", background: C.greenSoft, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 16, boxShadow: "0 10px 30px " + C.green + "33" }}><Icon name="check" size={44} color={C.green} /></div>
      <h1 style={{ fontSize: 27, fontWeight: 800, color: C.ink, margin: "0 0 4px", letterSpacing: -0.6 }}>{line}</h1>
      <p style={{ color: C.sub, margin: "0 0 8px", fontSize: 15 }}>You earned</p>
      <div style={{ fontSize: 52, fontWeight: 800, color: C.amber, letterSpacing: -2, lineHeight: 1, display: "flex", alignItems: "center", gap: 10 }}><Icon name="star" size={40} color={C.amber} /> {pts}</div>
      <p style={{ color: C.sub, margin: "6px 0 22px", fontSize: 14, fontWeight: 600 }}>points this round</p>
      <div style={{ background: C.surface, borderRadius: 22, padding: "16px 26px", border: "1px solid " + C.line, display: "flex", gap: 26, boxShadow: "0 10px 30px rgba(28,26,46,0.08)" }}><Stat big={reviews} label="Reviews" color={C.fa} /><Divider /><Stat big={dayStreak} label={<span>Day streak <Icon name="fire" size={11} color={C.primary} /></span>} color={C.primary} /></div>
      <div style={{ width: "100%", maxWidth: 320, marginTop: 26, display: "flex", flexDirection: "column", gap: 12 }}>
        <PrimaryButton onClick={onDashboard}>Back to dashboard</PrimaryButton>
        <button onClick={onShare} className="press" style={{ padding: 14, borderRadius: 18, border: "1.5px solid " + C.line, background: C.surface, color: C.ink, fontSize: 15, fontWeight: 800, cursor: "pointer", fontFamily: FONT, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}><Icon name="arrow-up-from-bracket" size={14} color={C.ink} /> Share result</button>
        {shared && <div style={{ fontSize: 13, color: C.green, fontWeight: 700 }}>{shared}</div>}
      </div>
    </div>
  );
}

/* ===================== PRIMITIVES ===================== */
function Shell({ children }) { return (<div style={{ minHeight: "100vh", width: "100%", display: "flex", justifyContent: "center", background: C.bg, fontFamily: FONT }}><div className="frame" style={{ width: "100%", maxWidth: 440, position: "relative", display: "flex", flexDirection: "column" }}>{children}</div></div>); }
function PrimaryButton({ children, onClick, disabled }) { return (<button onClick={onClick} disabled={disabled} className="press" style={{ width: "100%", padding: 16, borderRadius: 18, border: "none", cursor: disabled ? "not-allowed" : "pointer", background: disabled ? C.line : C.primary, color: disabled ? C.sub : "#fff", fontSize: 16.5, fontWeight: 800, fontFamily: FONT, letterSpacing: -0.2, boxShadow: disabled ? "none" : "0 8px 22px " + C.primary + "44", transition: "all .15s" }}>{children}</button>); }
function actionBtn(color) { return { width: 64, height: 64, borderRadius: "50%", border: "none", cursor: "pointer", background: color, color: "#fff", boxShadow: "0 8px 20px " + color + "55", display: "flex", alignItems: "center", justifyContent: "center" }; }
function StyleTag() {
  return (<style>{`
    .frame { height: 100vh; height: 100dvh; }
    @keyframes confetti { 0% { transform: translateY(-20px) rotate(0); opacity:1 } 85% { opacity:1 } 100% { transform: translateY(680px) rotate(560deg); opacity:0 } }
    @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
    @keyframes sheet { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pop { animation: pop .5s cubic-bezier(.2,.8,.2,1); }
    .sheet-in { animation: sheet .3s cubic-bezier(.2,.8,.2,1); }
    .spinner { width:15px; height:15px; border:3px solid rgba(0,0,0,0.12); border-top-color:currentColor; border-radius:50%; animation: spin .7s linear infinite; display:inline-block; vertical-align:middle; }
    .press { transition: transform .08s ease; }
    .press:active { transform: scale(0.95); }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    input::placeholder { color: #B6B2CE; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: ` + C.line + `; border-radius: 4px; }
  `}</style>);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
