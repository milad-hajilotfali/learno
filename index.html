    /* html2canvas (~200KB) is only needed for the share-image feature. Load it
       lazily so it never blocks cold start. __loadH2C() resolves once ready;
       we also kick off a low-priority preload after the app is interactive. */
    window.__loadH2C = function () {
      if (window.html2canvas) return Promise.resolve();
      if (window.__h2cPromise) return window.__h2cPromise;
      window.__h2cPromise = new Promise(function (resolve) {
        var s = document.createElement("script");
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
        s.async = true;
        s.onload = function () { resolve(); };
        s.onerror = function () { resolve(); }; /* shareImage falls back to text */
        document.head.appendChild(s);
      });
      return window.__h2cPromise;
    };
    window.addEventListener("load", function () {
      var idle = window.requestIdleCallback || function (f) { return setTimeout(f, 2000); };
      idle(function () { window.__loadH2C(); });
    });

/* ── PROGRESS HELPERS ── */

function saveCardIds(userId, lang, chapter, ids) {
  if (!userId) return;
  supabase.from("progress").upsert({
    user_id: userId, language: lang || "de",
    level: JSON.stringify(ids).slice(0, 60000),
    chapter: chapter, completed: false, score: ids.length,
    last_studied: new Date().toISOString()
  }, { onConflict: "user_id,language,chapter" }).then(function(){});
}

function loadCardIds(userId, lang, chapter, callback) {
  if (!userId) return;
  supabase.from("progress").select("level")
    .eq("user_id", userId).eq("language", lang || "de").eq("chapter", chapter)
    .maybeSingle().then(function(res) {
      if (!res.data) { callback([]); return; }
      try { callback(JSON.parse(res.data.level) || []); } catch(e) { callback([]); }
    });
}

function saveLearnedIds(userId, lang, learnedIds) {
  if (!userId || !learnedIds) return;
  saveCardIds(userId, lang, "__learnedids__", learnedIds);
}

function loadLearnedIds(userId, lang, callback) {
  loadCardIds(userId, lang, "__learnedids__", callback);
}

/* ── RECHARGE STORAGE ── per-word learned dates: { cardId: "YYYY-MM-DD" } of
   the LAST point-paying right swipe. Stored exactly like __learnedids__
   (JSON in the `level` column). __learnedids__ stays dual-written, so chapter
   progress, level unlocks, lock screens and exams keep reading learned status
   exactly as before. */
function saveLearnedAt(userId, lang, map) {
  if (!userId || !map) return;
  supabase.from("progress").upsert({
    user_id: userId, language: lang || "de",
    level: JSON.stringify(map).slice(0, 60000),
    chapter: "__learnedat__", completed: false, score: Object.keys(map).length,
    last_studied: new Date().toISOString()
  }, { onConflict: "user_id,language,chapter" }).then(function(){});
}
/* callback(null) means the row doesn't exist yet (triggers one-time
   migration); otherwise callback receives the parsed map (possibly {}) */
function loadLearnedAt(userId, lang, callback) {
  if (!userId) return;
  supabase.from("progress").select("level")
    .eq("user_id", userId).eq("language", lang || "de").eq("chapter", "__learnedat__")
    .maybeSingle().then(function(res) {
      if (!res.data) { callback(null); return; }
      try {
        var m = JSON.parse(res.data.level);
        callback(m && typeof m === "object" && !Array.isArray(m) ? m : {});
      } catch (e) { callback({}); }
    });
}
