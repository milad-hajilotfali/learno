  signInWithEmail: async (email, name) => { await delay(450); return { id: "mock-" + Date.now(), email, name: (name && name.trim()) || (email.split("@")[0] || "friend") }; },
  signInWithGoogle: async (name) => { await delay(450); return { id: "mock-google", email: "learner@gmail.com", name: (name && name.trim()) || "friend" }; },

  translate: async (text, from, to) => {
    const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + from + "|" + to);
    const d = await r.json();
    const t = d && d.responseData && d.responseData.translatedText;
    if (!t) throw new Error("no translation");
    return t;
  },
  generateCard: async (rawWord, language) => {
    const sys = "You are a precise language-learning assistant. Respond ONLY with a single minified JSON object. No markdown, no code fences, no commentary.";
    const targetFmt = language === "fa" ? "Finglish (Latin-script transliteration of Persian, never Farsi script)" : "German (include the article der/die/das for nouns)";
    const persianExtra = language === "fa" ? ',\n"farsi": the headword in real Farsi/Persian script,\n"farsiExample": the example sentence in real Farsi/Persian script' : "";
    const prompt = "The learner studies " + langFull(language) + '. Build a flashcard for: "' + rawWord + '".\nReturn JSON with exactly these string fields:\n{"word": the headword in ' + targetFmt + ',\n"pron": a simple pronunciation guide,\n"translation": concise English meaning,\n"example": one short natural sentence in ' + (language === "fa" ? "Finglish" : "German") + ',\n"exampleTranslation": English translation,\n"note": part of speech' + (language === "de" ? " plus gender for nouns" : "") + '}';
    const res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, system: sys, messages: [{ role: "user", content: prompt }] }) });
    const data = await res.json();
    let text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    text = text.replace(/```json/gi, "").replace(/```/g, "").trim();
    let obj; try { obj = JSON.parse(text); } catch (_) { const m = text.match(/\{[\s\S]*\}/); if (!m) throw new Error("parse"); obj = JSON.parse(m[0]); }
    return { word: obj.word || rawWord, pron: obj.pron || "", translation: obj.translation || "", example: obj.example || "", exampleTranslation: obj.exampleTranslation || "", note: obj.note || "", farsi: obj.farsi || "", farsiExample: obj.farsiExample || "" };
  },
};

/* ===================== HISTORY ===================== */
const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function buildHistory() {
  const TOTAL = 84; const now = new Date(); const out = [];
  for (let i = TOTAL - 1; i >= 0; i--) {
    const d = new Date(now); d.setDate(now.getDate() - i);
    const seed = d.getFullYear() * 372 + (d.getMonth() + 1) * 31 + d.getDate();
    const r = Math.abs(Math.sin(seed));
    let pts;
    if (i === 0) pts = 0;
    else if (i <= 10) pts = Math.round(8 + r * 14);
    else pts = r > 0.32 ? Math.round(5 + r * 16) : 0;
    out.push({ date: d.toISOString().slice(0, 10), label: DAY_NAMES[d.getDay()], dm: MONTHS[d.getMonth()] + " " + d.getDate(), points: pts });
  }
  return out;
}
function calcStreak(h) { let i = h.length - 1; if (h[i].points === 0) i--; let s = 0; for (; i >= 0; i--) { if (h[i].points > 0) s++; else break; } return s; }

/* ===================== SINGLE FLASHCARD MODAL ===================== */
function FlashcardModal({ card, learned, onResult, onClose }) {
  const [flipped, setFlipped] = useState(false);
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const [exitDir, setExitDir] = useState(null);
  const sx = useRef(0); const sy = useRef(0); const moved = useRef(false); const act = useRef(false); const lock = useRef(false);
  const finish = (dir) => { if (lock.current) return; lock.current = true; setExitDir(dir); setTimeout(() => { onResult(card.id, dir === "right"); onClose(); }, 300); };
  const down = (e) => { if (exitDir) return; act.current = true; moved.current = false; sx.current = e.clientX; sy.current = e.clientY; setDragging(true); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} };
  const move = (e) => { if (!act.current || exitDir) return; const dx = e.clientX - sx.current, dy = e.clientY - sy.current; if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved.current = true; setDragX(dx); };
  const up = () => { if (!act.current) return; act.current = false; setDragging(false); if (!moved.current) { setFlipped((f) => !f); setDragX(0); return; } if (dragX > 100) finish("right"); else if (dragX < -100) finish("left"); else setDragX(0); };
  const knowHint = Math.max(0, Math.min(1, dragX / 100)); const reviewHint = Math.max(0, Math.min(1, -dragX / 100));
  const transform = exitDir ? ("translateX(" + (exitDir === "right" ? 560 : -560) + "px) rotate(" + (exitDir === "right" ? 24 : -24) + "deg)") : ("translateX(" + dragX + "px) rotate(" + (dragX / 24) + "deg)");
  const tint = exitDir === "right" ? { c: C.green, o: 0.9, t: "DONE" } : exitDir === "left" ? { c: C.red, o: 0.9, t: "LATER" } : dragX > 0 ? { c: C.green, o: knowHint * 0.85, t: "DONE" } : dragX < 0 ? { c: C.red, o: reviewHint * 0.85, t: "LATER" } : { c: C.green, o: 0, t: "" };
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(20,18,40,0.55)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", zIndex: 110, padding: 22 }}>
      <button onClick={onClose} className="press" aria-label="Close" style={{ position: "absolute", top: 20, right: 20, width: 40, height: 40, borderRadius: "50%", border: "none", background: "rgba(255,255,255,0.92)", color: C.ink, cursor: "pointer" }}><Icon name="xmark" size={17} color={C.ink} /></button>
      <div onClick={(e) => e.stopPropagation()} className="card-pop" style={{ width: "100%", maxWidth: 330 }}>
        <div style={{ fontSize: 12.5, color: "rgba(255,255,255,0.85)", fontWeight: 700, textAlign: "center", marginBottom: 10 }}>{learned ? "Marked done ✓ — swipe to update" : "Swipe right when you know it"}</div>
        <div onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} style={{ position: "relative", width: "100%", height: 450, transform, transition: dragging ? "none" : "transform .3s cubic-bezier(.2,.8,.2,1)", touchAction: "none", cursor: "grab" }}>
          <div style={{ position: "absolute", inset: 0, perspective: 1300 }}><div style={{ position: "relative", width: "100%", height: "100%", transformStyle: "preserve-3d", transform: "rotateY(" + (flipped ? 180 : 0) + "deg)", transition: "transform .55s cubic-bezier(.4,.15,.2,1)" }}><CardFront card={card} /><CardBack card={card} /></div></div>
          <div style={{ position: "absolute", inset: 0, borderRadius: 28, background: tint.c, opacity: tint.o, display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none", zIndex: 6 }}>{tint.t && <span style={{ color: "#fff", fontWeight: 900, fontSize: 34, letterSpacing: 2 }}>{tint.t}</span>}</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 24, marginTop: 18 }}>
          <button onClick={() => finish("left")} className="press" style={actionBtn(C.red, 56)} aria-label="Later"><Icon name="xmark" size={22} color="#fff" /></button>
          <button onClick={() => setFlipped((f) => !f)} className="press" style={{ background: "rgba(255,255,255,0.92)", border: "none", borderRadius: "50%", width: 48, height: 48, cursor: "pointer", color: C.sub }}><Icon name="arrows-rotate" size={17} color={C.sub} /></button>
          <button onClick={() => finish("right")} className="press" style={actionBtn(C.green, 56)} aria-label="Done"><Icon name="check" size={22} color="#fff" /></button>
        </div>
      </div>
    </div>
  );
}

/* ===================== STREAK & POINTS DIALOGS ===================== */
function StreakDialog({ history, streak, onClose }) {
  const now = new Date(); const year = now.getFullYear(), month = now.getMonth();
  const map = {}; history.forEach((d) => { map[d.date] = d.points; });
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = []; for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) { const ds = new Date(year, month, d).toISOString().slice(0, 10); cells.push({ d, active: (map[ds] || 0) > 0, today: d === now.getDate() }); }
  return (
    <Sheet onClose={onClose} title="Your streak">
      <div style={{ display: "flex", alignItems: "center", gap: 10, background: C.amber + "14", border: "1px solid " + C.amber + "30", borderRadius: 16, padding: "12px 16px", marginBottom: 16 }}>

      </div>
      <div style={{ fontSize: 14, fontWeight: 800, color: C.ink, marginBottom: 10 }}>{MONTHS[month]} {year}</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 6, marginBottom: 6 }}>{["S", "M", "T", "W", "T", "F", "S"].map((w, i) => <div key={i} style={{ textAlign: "center", fontSize: 11, fontWeight: 800, color: C.sub }}>{w}</div>)}</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 6 }}>{cells.map((c, i) => (<div key={i} style={{ aspectRatio: "1", display: "flex", alignItems: "center", justifyContent: "center" }}>{c && <div style={{ width: "84%", height: "84%", borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12.5, fontWeight: 700, background: c.active ? C.amber : C.bg, color: c.active ? "#fff" : C.sub, boxShadow: c.today ? "0 0 0 2.5px " + C.primary : "none" }}>{c.d}</div>}</div>))}</div>

  return (
    <Sheet onClose={onClose} title="Points & rewards">

function PointsChart({ history }) {
  const [mode, setMode] = useState("week");
  const [offset, setOffset] = useState(0);
  const [grow, setGrow] = useState(false);
  useEffect(() => { setOffset(0); }, [mode]);
  useEffect(() => { setGrow(false); const t = setTimeout(() => setGrow(true), 40); return () => clearTimeout(t); }, [mode, offset]);
  const total = history.length; const todayIdx = total - 1; const weeksAvail = Math.ceil(total / 7);
  let bars = [], rangeLabel = "", periodTotal = 0, canPrev = false, canNext = false;
  if (mode === "week") {
    const end = total + offset * 7, start = end - 7;
    for (let idx = start; idx < end; idx++) { if (idx < 0 || idx >= total) { bars.push({ label: "", points: 0, ghost: true }); continue; } const d = history[idx]; bars.push({ label: d.label, points: d.points, today: idx === todayIdx }); periodTotal += d.points; }
    rangeLabel = offset === 0 ? "This week" : history[Math.max(0, start)].dm + " – " + history[Math.min(total - 1, end - 1)].dm;
    canNext = offset < 0; canPrev = -offset < weeksAvail - 1;
  } else {
    const buckets = []; for (let e = total; e > 0; e -= 7) { const s = Math.max(0, e - 7); const slice = history.slice(s, e); buckets.push({ dm: history[s].dm, points: slice.reduce((a, x) => a + x.points, 0), current: e === total }); }
    const pages = Math.ceil(buckets.length / 4); const pageStart = (-offset) * 4; const page = buckets.slice(pageStart, pageStart + 4).reverse();
    page.forEach((b) => { bars.push({ label: b.dm, points: b.points, today: b.current }); periodTotal += b.points; });
    rangeLabel = offset === 0 ? "Last 4 weeks" : (page.length ? page[0].dm + " – " + page[page.length - 1].dm : "");
    canNext = offset < 0; canPrev = -offset < pages - 1;
  }
  const max = Math.max(10, ...bars.map((b) => b.points));
  const goPrev = () => { if (canPrev) setOffset((o) => o - 1); };
  const goNext = () => { if (canNext) setOffset((o) => o + 1); };
  const navBtn = (dir, enabled, onClick) => (<button onClick={enabled ? onClick : undefined} disabled={!enabled} className="press" style={{ width: 34, height: 34, borderRadius: 11, border: "1.5px solid " + C.line, background: C.surface, color: enabled ? C.ink : "#D8D5E8", cursor: enabled ? "pointer" : "default" }}><Icon name={dir === "prev" ? "chevron-left" : "chevron-right"} size={13} color={enabled ? C.ink : "#D8D5E8"} /></button>);
  const sx = useRef(0); const sw = useRef(false);
  const down = (e) => { sw.current = true; sx.current = e.clientX; };
  const up = (e) => { if (!sw.current) return; sw.current = false; const dx = e.clientX - sx.current; if (Math.abs(dx) < 40) return; if (dx < 0) goNext(); else goPrev(); };
  return (
    <div style={{ background: C.surface, borderRadius: 22, padding: "18px 18px 14px", border: "1px solid " + C.line, boxShadow: "0 8px 24px rgba(28,26,46,0.05)" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, gap: 10 }}>
        <div style={{ display: "flex", background: C.bg, borderRadius: 12, padding: 3 }}>{["week", "month"].map((k) => { const on = mode === k; return (<button key={k} onClick={() => setMode(k)} className="press" style={{ padding: "7px 14px", borderRadius: 10, border: "none", cursor: "pointer", background: on ? C.surface : "transparent", color: on ? C.primary : C.sub, fontWeight: 800, fontSize: 13, fontFamily: FONT, boxShadow: on ? "0 2px 6px rgba(28,26,46,0.08)" : "none", textTransform: "capitalize" }}>{k}</button>); })}</div>
        <span style={{ fontSize: 14, fontWeight: 800, color: C.amber, display: "flex", alignItems: "center", gap: 5 }}><Icon name="star" size={13} color={C.amber} /> {periodTotal} pts</span>
      </div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        {navBtn("prev", canPrev, goPrev)}<span style={{ fontSize: 13.5, fontWeight: 800, color: C.ink }}>{rangeLabel}</span>{navBtn("next", canNext, goNext)}
      </div>
      <div onPointerDown={down} onPointerUp={up} onPointerCancel={() => { sw.current = false; }} style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 8, height: 104, touchAction: "pan-y", cursor: "grab" }}>{bars.map((d, i) => { const h = grow ? Math.max(d.points > 0 ? 8 : 3, (d.points / max) * 84) : 3; return (<div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6, height: "100%", justifyContent: "flex-end" }}><span style={{ fontSize: 10.5, fontWeight: 700, color: d.points ? C.ink : "transparent" }}>{d.points || 0}</span><div style={{ width: "100%", maxWidth: 28, height: h, borderRadius: 8, background: d.ghost ? C.line : (d.today ? "linear-gradient(180deg,#6A5BFF,#A06BFF)" : C.primarySoft), transition: "height .8s cubic-bezier(.2,.8,.2,1)", boxShadow: d.today ? "0 4px 12px " + C.primary + "55" : "none", opacity: d.ghost ? 0.5 : 1 }} /><span style={{ fontSize: mode === "month" ? 9.5 : 11, fontWeight: 700, color: d.today ? C.primary : C.sub, whiteSpace: "nowrap" }}>{d.label}</span></div>); })}</div>
      <div style={{ textAlign: "center", fontSize: 11, color: C.sub, fontWeight: 600, marginTop: 8 }}>swipe or use arrows to browse</div>
    </div>
  );
}

    <div style={{ padding: "24px 20px 28px", display: "flex", flexDirection: "column", gap: 14 }}>

      <button onClick={() => setAdding(true)} className="press" style={{ padding: 14, borderRadius: 16, border: "2px dashed " + C.primary + "55", background: C.primarySoft, color: C.primary, fontSize: 15, fontWeight: 800, cursor: "pointer", fontFamily: FONT, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}><Icon name="plus" size={14} color={C.primary} /> Add a flashcard</button>
      <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 2, margin: "0 -4px", padding: "0 4px 2px" }}>
        {chips.map((ch) => { const on = group === ch.k; return (<button key={ch.k} onClick={() => setGroup(ch.k)} className="press" style={{ flexShrink: 0, padding: "9px 14px", borderRadius: 13, border: "1.5px solid " + (on ? C.primary : C.line), background: on ? C.primary : C.surface, color: on ? "#fff" : C.sub, fontWeight: 800, fontSize: 13.5, cursor: "pointer", fontFamily: FONT }}>{ch.label} <span style={{ opacity: 0.75, fontWeight: 700 }}>{ch.n}</span></button>); })}
      </div>
      <div style={{ position: "relative" }}><span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)" }}><Icon name="magnifying-glass" size={14} color={C.sub} /></span><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search this level…" style={{ width: "100%", padding: "11px 14px 11px 38px", fontSize: 14.5, borderRadius: 13, border: "1.5px solid " + C.line, outline: "none", fontFamily: FONT, color: C.ink, boxSizing: "border-box" }} /></div>
      <div style={{ fontSize: 12.5, color: C.sub, fontWeight: 700 }}>{group === "mine" ? "Your flashcards" : group + " · " + LEVEL_TITLE[group]} — {groupDone}/{groupList.length} done</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
        {list.length === 0 ? <div style={{ color: C.sub, fontSize: 13.5, textAlign: "center", padding: "18px 0" }}>{group === "mine" ? "No flashcards yet — tap “Add a flashcard”." : "No matches."}</div> : list.map((c) => <Row key={c.id} c={c} />)}
      </div>
      {adding && <AddWordModal selectedLangs={langsPresent} curLevel={group === "mine" ? curLevel : group} onClose={() => setAdding(false)} onAdd={onAdd} />}
      {open && <FlashcardModal card={open} learned={learnedIds.includes(open.id)} onResult={onResult} onClose={() => setOpen(null)} />}
    </div>
  );
}

/* ===================== FRIENDS ===================== */
function FriendsPage() {
  const [q, setQ] = useState(""); const [results, setResults] = useState(MOCK_USERS); const [loading, setLoading] = useState(false); const [sel, setSel] = useState(null);
  useEffect(() => { let act = true; setLoading(true); dataService.searchUsers(q).then((r) => { if (act) { setResults(r); setLoading(false); } }); return () => { act = false; }; }, [q]);
  return (
    <div style={{ padding: "24px 20px 28px", display: "flex", flexDirection: "column", gap: 16 }}>
      <h1 style={{ fontSize: 24, fontWeight: 800, color: C.ink, margin: 0, letterSpacing: -0.6 }}>Friends</h1>
      <div style={{ position: "relative" }}><span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)" }}><Icon name="magnifying-glass" size={15} color={C.sub} /></span><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search learners by name…" style={{ width: "100%", padding: "13px 15px 13px 40px", fontSize: 15, borderRadius: 14, border: "1.5px solid " + C.line, outline: "none", fontFamily: FONT, color: C.ink, boxSizing: "border-box" }} /></div>
      {loading && <div style={{ color: C.sub, fontSize: 13, fontWeight: 600 }}><span className="spinner" /> searching…</div>}
      <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
        {results.length === 0 && !loading && <div style={{ color: C.sub, fontSize: 14, textAlign: "center", padding: 20 }}>No learners match “{q}”.</div>}
        {results.map((u) => { const tot = u.fa.done + u.de.done; return (
          <button key={u.id} onClick={() => setSel(u)} className="press" style={{ display: "flex", alignItems: "center", gap: 13, background: C.surface, border: "1px solid " + C.line, borderRadius: 16, padding: "12px 14px", cursor: "pointer", textAlign: "left", fontFamily: FONT }}>
            <Avatar seed={u.avatar} size={46} />
            <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontWeight: 800, color: C.ink, fontSize: 16 }}>{u.name}</div><div style={{ fontSize: 12.5, color: C.sub, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}><Icon name="fire" size={11} color={C.amber} /> {u.streak} · <Icon name="star" size={11} color={C.amber} /> {u.points} · {tot} learned</div></div>
            <Icon name="chevron-right" size={14} color={C.sub} />
          </button>); })}
      </div>
      {sel && <FriendDetail user={sel} onClose={() => setSel(null)} />}
    </div>
  );
}
function FriendDetail({ user, onClose }) {
  const langs = ["fa", "de"].filter((l) => user[l].total > 0);
  return (
    <Sheet onClose={onClose}>
      <div style={{ display: "flex", alignItems: "center", gap: 14 }}><Avatar seed={user.avatar} size={64} ring={C.primary} /><div><div style={{ fontSize: 22, fontWeight: 800, color: C.ink }}>{user.name}</div><div style={{ fontSize: 13, color: C.sub, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}><Icon name="fire" size={12} color={C.amber} /> {user.streak}-day · <Icon name="star" size={12} color={C.amber} /> {user.points} pts</div></div></div>
      <div style={{ marginTop: 18, background: "#FBFAFF", border: "1px solid " + C.line, borderRadius: 18, padding: 18, display: "flex", justifyContent: "space-around", gap: 14, flexWrap: "wrap" }}>{langs.map((l) => { const m = langMeta[l]; const d = user[l]; return <Ring key={l} pct={d.total ? d.done / d.total : 0} color={m.color} value={d.done + "/" + d.total} label={m.flag + " " + m.label} />; })}</div>
    </Sheet>
  );
}

/* ===================== ADD FLASHCARD ===================== */
function Field({ label, value, onChange, placeholder, dir }) {
  return (<div style={{ marginTop: 12 }}><label style={{ fontSize: 12.5, fontWeight: 700, color: C.sub }}>{label}</label><input value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} dir={dir || "ltr"} style={{ width: "100%", marginTop: 5, padding: "11px 13px", fontSize: 14.5, borderRadius: 12, border: "1.5px solid " + C.line, outline: "none", fontFamily: FONT, color: C.ink, boxSizing: "border-box" }} /></div>);
}
function AddWordModal({ selectedLangs, curLevel, onClose, onAdd }) {
  const [lang, setLang] = useState(selectedLangs[0] || "fa");
  const [f, setF] = useState({ word: "", translation: "", pron: "", example: "", exampleTranslation: "", farsi: "", farsiExample: "" });
  const set = (k) => (v) => setF((p) => ({ ...p, [k]: v }));
  const [auto, setAuto] = useState("idle"); const m = langMeta[lang];
  const autofill = async () => {
    if (!f.word.trim() || auto === "loading") return;
    setAuto("loading");
    try { const c = await dataService.generateCard(f.word.trim(), lang); setF({ word: c.word || f.word, translation: c.translation || "", pron: c.pron || "", example: c.example || "", exampleTranslation: c.exampleTranslation || "", farsi: c.farsi || "", farsiExample: c.farsiExample || "" }); setAuto("done"); return; } catch (_) {}
    try { const t = await dataService.translate(f.word.trim(), lang, "en"); setF((p) => ({ ...p, translation: t })); setAuto("partial"); return; } catch (_) {}
    setAuto("error");
  };
  const canAdd = f.word.trim() && f.translation.trim();
  const add = () => { if (!canAdd) return; onAdd({ id: "u" + Date.now(), language: lang, level: curLevel, word: f.word.trim(), translation: f.translation.trim(), pron: f.pron.trim(), example: f.example.trim(), exampleTranslation: f.exampleTranslation.trim(), note: "added by you", farsi: f.farsi.trim(), farsiExample: f.farsiExample.trim(), custom: true }); onClose(); };
  return (
    <Sheet onClose={onClose} title="Add a flashcard">
      <p style={{ color: C.sub, fontSize: 14, margin: "-8px 0 14px" }}>Type the flashcard, tap auto-fill, or just fill it in yourself.</p>
      {selectedLangs.length > 1 && (<div style={{ display: "flex", gap: 10, marginBottom: 6 }}>{selectedLangs.map((l) => { const lm = langMeta[l]; const on = lang === l; return <button key={l} onClick={() => setLang(l)} className="press" style={{ flex: 1, padding: "10px", borderRadius: 12, border: on ? "2px solid " + lm.color : "2px solid " + C.line, background: on ? lm.soft : C.surface, fontWeight: 700, color: C.ink, cursor: "pointer", fontFamily: FONT }}>{lm.flag} {lm.label}</button>; })}</div>)}
      <Field label={"Flashcard (" + langMeta[lang].label + (lang === "fa" ? ", Finglish" : "") + ")"} value={f.word} onChange={set("word")} placeholder={lang === "fa" ? "e.g. mehraboon" : "e.g. der Apfel"} />
      <button onClick={autofill} disabled={!f.word.trim() || auto === "loading"} className="press" style={{ width: "100%", marginTop: 10, padding: 11, borderRadius: 12, border: "1.5px solid " + C.primary + "55", background: C.primarySoft, color: C.primary, fontWeight: 800, fontSize: 14, cursor: f.word.trim() ? "pointer" : "default", fontFamily: FONT, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>{auto === "loading" ? <><span className="spinner" /> Auto-filling…</> : <><Icon name="wand-magic-sparkles" size={14} color={C.primary} /> Auto-fill card</>}</button>
      {auto === "done" && <div style={{ fontSize: 12.5, color: C.green, marginTop: 8, fontWeight: 600 }}>Filled in meaning, pronunciation & example — edit anything you like.</div>}
      {auto === "partial" && <div style={{ fontSize: 12.5, color: C.green, marginTop: 8, fontWeight: 600 }}>Added the translation — add an example/pronunciation if you like.</div>}
      {auto === "error" && <div style={{ fontSize: 12.5, color: C.sub, marginTop: 8 }}>Couldn't auto-fill right now — just fill in the fields below.</div>}
      <Field label="Translation (English)" value={f.translation} onChange={set("translation")} placeholder="e.g. the apple" />
      <Field label="Pronunciation (optional)" value={f.pron} onChange={set("pron")} placeholder="e.g. dair AP-fel" />
      <Field label="Example sentence (optional)" value={f.example} onChange={set("example")} placeholder="a short sentence" />
      <Field label="Example in English (optional)" value={f.exampleTranslation} onChange={set("exampleTranslation")} placeholder="its translation" />
      {lang === "fa" && <Field label="Farsi script (optional · used for audio)" value={f.farsi} onChange={set("farsi")} placeholder="e.g. مهربون" dir="rtl" />}
      <div style={{ fontSize: 12, color: C.sub, marginTop: 12, fontWeight: 600 }}>Will be added to your <b style={{ color: C.primary }}>{curLevel}</b> set.</div>
      <button onClick={add} disabled={!canAdd} className="press" style={{ width: "100%", marginTop: 14, padding: 15, borderRadius: 16, border: "none", background: canAdd ? C.green : C.line, color: canAdd ? "#fff" : C.sub, fontWeight: 800, fontSize: 15.5, cursor: canAdd ? "pointer" : "default", fontFamily: FONT, boxShadow: canAdd ? "0 6px 16px " + C.green + "55" : "none" }}>Add to my flashcards</button>
    </Sheet>
  );
}

/* ===================== SESSION COMPLETE ===================== */
const CHEERS = [(n) => "You smashed it, " + n + "! 💥", (n) => "On fire, " + n + "! 🔥", (n) => "Nailed it, " + n + "! 🎉", (n) => "Look at you go, " + n + "! ✨", (n) => "Unstoppable, " + n + "! ⚡"];
function SessionComplete({ points, reviews, dayStreak, name, level, onDashboard }) {
  const pts = useCountUp(points);
  const line = useMemo(() => CHEERS[Math.floor(Math.random() * CHEERS.length)]((name || "friend")), [name]);
  const [shared, setShared] = useState("");
  const capRef = useRef(null);
  useEffect(() => { playChime(); }, []);
  const onShare = async () => {
    const txt = shareText(points, dayStreak, name);
    const r = await shareImage(capRef.current, txt, "lingo-result.png", C.bg);
    if (r === "shared") return;
    if (r === "downloaded") { setShared("Image saved!"); setTimeout(() => setShared(""), 2200); return; }
    try { if (navigator.share) { await navigator.share({ text: txt }); return; } } catch (_) {}
    try { await navigator.clipboard.writeText(txt); setShared("Copied to clipboard!"); setTimeout(() => setShared(""), 2000); return; } catch (_) {}
    setShared("Share not available here"); setTimeout(() => setShared(""), 2000);
  };
  return (
    <div style={{ position: "relative", width: "100%", display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", padding: "10px 0" }}>
      <Confetti />
      <div ref={capRef} style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", padding: "12px 16px", borderRadius: 24, width: "100%", maxWidth: 320 }}>
        <div className="pop" style={{ width: 88, height: 88, borderRadius: "50%", background: C.greenSoft, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 14, boxShadow: "0 10px 30px " + C.green + "33" }}><Icon name="check" size={40} color={C.green} /></div>
        <h1 style={{ fontSize: 25, fontWeight: 800, color: C.ink, margin: "0 0 4px", letterSpacing: -0.6 }}>{line}</h1>
        <p style={{ color: C.sub, margin: "0 0 8px", fontSize: 14.5 }}>{level ? level + " session complete · you earned" : "You earned"}</p>
        <div style={{ fontSize: 50, fontWeight: 800, color: C.amber, letterSpacing: -2, lineHeight: 1, display: "flex", alignItems: "center", gap: 10 }}><Icon name="star" size={38} color={C.amber} /> {pts}</div>
        <p style={{ color: C.sub, margin: "6px 0 18px", fontSize: 14, fontWeight: 600 }}>points this round</p>
        <div style={{ background: C.surface, borderRadius: 22, padding: "16px 26px", border: "1px solid " + C.line, display: "flex", gap: 26, boxShadow: "0 10px 30px rgba(28,26,46,0.08)" }}><Stat big={reviews} label="Reviews" color={C.fa} /><Divider /><Stat big={dayStreak} label={<span>Day streak 🔥</span>} color={C.primary} /></div>
      </div>
      <div style={{ width: "100%", maxWidth: 320, marginTop: 22, display: "flex", flexDirection: "column", gap: 12 }}>
        <PrimaryButton onClick={onDashboard}>Back to dashboard</PrimaryButton>
        <button onClick={onShare} className="press" style={{ padding: 14, borderRadius: 18, border: "1.5px solid " + C.line, background: C.surface, color: C.ink, fontSize: 15, fontWeight: 800, cursor: "pointer", fontFamily: FONT, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}><Icon name="arrow-up-from-bracket" size={14} color={C.ink} /> Share result</button>
        {shared && <div style={{ fontSize: 13, color: C.green, fontWeight: 700 }}>{shared}</div>}
      </div>
    </div>
  );
}

/* ===================== PRIMITIVES ===================== */
function Shell({ children }) { return (<div style={{ height: "100vh", height: "100dvh", width: "100%", display: "flex", justifyContent: "center", background: C.bg, fontFamily: FONT, overflow: "hidden" }}><div className="frame" style={{ width: "100%", maxWidth: 440, height: "100%", position: "relative", display: "flex", flexDirection: "column", overflow: "hidden" }}>{children}</div></div>); }
function PrimaryButton({ children, onClick, disabled }) { return (<button onClick={onClick} disabled={disabled} className="press" style={{ width: "100%", padding: 16, borderRadius: 18, border: "none", cursor: disabled ? "not-allowed" : "pointer", background: disabled ? C.line : C.primary, color: disabled ? C.sub : "#fff", fontSize: 16.5, fontWeight: 800, fontFamily: FONT, letterSpacing: -0.2, boxShadow: disabled ? "none" : "0 8px 22px " + C.primary + "44", transition: "all .15s" }}>{children}</button>); }
function actionBtn(color, size) { size = size || 64; return { width: size, height: size, borderRadius: "50%", border: "none", cursor: "pointer", background: color, color: "#fff", boxShadow: "0 8px 20px " + color + "55", display: "flex", alignItems: "center", justifyContent: "center" }; }
function StyleTag() {
  return (<style>{`
    @keyframes confetti { 0% { transform: translateY(-20px) rotate(0); opacity:1 } 85% { opacity:1 } 100% { transform: translateY(680px) rotate(560deg); opacity:0 } }
    @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
    @keyframes sheet { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes cardpop { from { transform: translateY(34px) scale(.92); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pop { animation: pop .5s cubic-bezier(.2,.8,.2,1); }
    .sheet-in { animation: sheet .3s cubic-bezier(.2,.8,.2,1); }
    .card-pop { animation: cardpop .32s cubic-bezier(.2,.8,.2,1); }
    .spinner { width:15px; height:15px; border:3px solid rgba(0,0,0,0.12); border-top-color:currentColor; border-radius:50%; animation: spin .7s linear infinite; display:inline-block; vertical-align:middle; }
    .press { transition: transform .08s ease; }
    .press:active { transform: scale(0.95); }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    input::placeholder { color: #B6B2CE; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: ` + C.line + `; border-radius: 4px; }
  `}</style>);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
